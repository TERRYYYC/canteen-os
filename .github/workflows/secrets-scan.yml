name: Secret scan

# PR 与 push 触发密钥扫描，命中即红。issue #26。
#
# 用 MIT 许可的 gitleaks CLI，不用 gitleaks/gitleaks-action 包装器：
#   - 包装器的 action.yml 头部写着「All Rights Reserved」+ GITLEAKS-ACTION END-USER LICENSE
#     AGREEMENT，v2 与 v3 都是，不符合 #26 的「MIT 或等价宽松协议」要求；CLI 本体 LICENSE 是 MIT。
#   - 顺带绕开包装器的运行时问题：v2 的 action.yml 是 node20，v3 才换成 node24。
#
# 忽略规则写在仓库根的 .gitleaks.toml —— 该文件不在本次改动里；缺失时 gitleaks 用内置默认规则，
# 不会因为找不到配置而失败。等 #26 的测试 PR 跑出第一批误报之后，再按「只允许 fixtures 中明确的
# 假值」补。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (MIT CLI)
    runs-on: ubuntu-latest
    steps:
      # 密钥进过历史就一直在历史里，浅克隆扫不到，所以取完整历史。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本与 sha256 取自 GitHub releases API 里该资产的 digest 字段（v8.30.1，2026-03-21 发布）。
      # 解包到 RUNNER_TEMP，避免把 tarball 里的 README/LICENSE 落进工作区。
      - name: Install gitleaks 8.30.1 (sha256 pinned)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSLf -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # gitleaks git [flags] [repo]：v8.19 起 detect 被 git / dir 子命令取代。
      # --redact 是 NoOptDefVal=100 的开关式参数；--exit-code 默认已是 1，写明以防上游改默认值。
      # --verbose 必须加：不加的话命中时日志只有一行「leaks found: N」，不说是哪条规则、
      # 哪个文件、哪个 commit，红了没法排查（首跑实测如此）。--redact 保证值本身仍被打码。
      - name: Scan full git history
        run: gitleaks git . --redact --verbose --exit-code 1
