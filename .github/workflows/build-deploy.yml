name: Build & Deploy

# push main → validate → translate（有 DEEPL_API_KEY 才跑，译文由 bot 回写 main）→ build-data → vite build → GitHub Pages
# 任一步失败即红、不部署（deploy 依赖 build 成功）。线上地址：https://terryyyc.github.io/canteen-os/
# 与 ci.yml 一致：pnpm 版本由根 package.json 的 packageManager 声明，pnpm/action-setup 不写 version。
# 前端契约（issue #8）：packages/web 由 `pnpm -C packages/web build` 产出 packages/web/dist/；
# build-data.mjs 写到 packages/web/public/data/，由 Vite 拷进 dist；根目录 pnpm-workspace.yaml 让根 install 装全部 workspace。

on:
  push:
    branches: [main]

  # #19 的 `POST /publish` 要从 Worker 触发这条流水线。GitHub 的 dispatch API
  # (POST /actions/workflows/build-deploy.yml/dispatches) 返回 204、不带 runId，
  # 所以调用方自己生成一个 request_id 传进来，由下面的 run-name 回显到 run 名字上，
  # Worker 轮询 runs 列表按名字认领自己那次 run（对应 #19 的 `GET /publish/:id` 四步进度）。
  # 手动重跑（Actions → Run workflow）也走这个入口，request_id 留空即可。
  workflow_dispatch:
    inputs:
      request_id:
        description: "调用方生成的唯一 ID，用于认领本次 run；手动触发可留空"
        required: false
        type: string

# 只在 dispatch 时改名：表达式求值为空串时 GitHub 回落到事件默认名，push 仍然显示提交信息。
run-name: ${{ inputs.request_id && format('publish · {0}', inputs.request_id) || '' }}

permissions:
  contents: write # bot 回写机翻（data/ 与 data/translations.lock.json）
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: validate → translate → build-data → vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 与 ci.yml 的三处一致（PR #71）：#66 把 qrcode@1.5.4 补进 pnpm-lock.yaml 之后，lockfile
      # 与 package.json 已同步，这里也从 --frozen-lockfile=false 收紧成冻结——部署流水线更不该
      # 默许悄悄改 lockfile，否则线上装到的依赖可能与 PR 上验证过的不是同一套。
      - name: Install workspace dependencies
        # Retain the step name consumed by the Worker publish progress contract.
        env:
          # Protected input; only the validated public URL is passed to later steps.
          WORKER_URL_INPUT: ${{ secrets.VITE_WORKER_URL }}
        run: |
          set -e
          # Validate before installation, translation commits or any publishing work.
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {isIP} from 'node:net';
          // Repository Secrets are masked by the runner before it prints step env.
          // The accepted value is still public build configuration, never a credential.
          const raw = process.env.WORKER_URL_INPUT ?? '';
          let summary;
          if (raw === '') {
            console.log('::warning::VITE_WORKER_URL is empty: read-only published content; this is not a full writable release.');
            summary = 'Read-only build: published Menu/Prep content remains available. Team editing, saved shopping lists and publishing require a configured Worker. This is not a full writable release.';
          } else {
            let address;
            try { address = new URL(raw); } catch {}
            const host = address?.hostname ?? '';
            const reserved = /(^|\.)(localhost|local|internal|test|invalid|example|example\.(com|net|org)|github\.io)$/.test(host);
            const dnsName = host.includes('.') && host.split('.').every(label => /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(label));
            if (!/^https:\/\/[^/@?#\\\s]+\/?$/i.test(raw) || address?.protocol !== 'https:'
                || address.username || address.password || address.pathname !== '/'
                || address.search || address.hash || !dnsName || isIP(host) || reserved) {
              // Never print an invalid value: it may accidentally contain a token.
              console.error('::error::VITE_WORKER_URL must be a public HTTPS Worker origin, with no credentials, API path, query or fragment; local, example and GitHub Pages addresses are not deployment API origins.');
              process.exit(1);
            }
            summary = 'Worker URL format checks passed only. Connectivity, authorization, target repository, and save/publish/rollback acceptance still require the pre-release checks in docs/field-test/week-43/ops-checklist.md.';
          }
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Web API configuration\n\n${summary}\n`);
          if (!process.env.GITHUB_ENV) {
            console.error('::error::VITE_WORKER_URL validated handoff requires GITHUB_ENV.');
            process.exit(1);
          }
          // Only a validated public origin (or explicit empty value) reaches later steps.
          appendFileSync(process.env.GITHUB_ENV, `VITE_WORKER_URL=${raw}\n`);
          NODE
          pnpm install --frozen-lockfile
          node scripts/prepare-team-image-tools.mjs

      - name: Validate data/**/*.json against schemas/*.schema.json
        run: node scripts/validate-schemas.mjs

      # DEEPL_API_KEY 只注入这一步的环境变量（docs/i18n.md §6.3），不 echo、不落盘。
      # 没配 secret 时整步跳过（translate.mjs 无 key 本身也 exit 0，但这里连 lock 都不动）。
      - name: Machine-translate missing en/uk (only when DEEPL_API_KEY is set)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "DEEPL_API_KEY not set — skipping machine translation"
            exit 0
          fi
          node scripts/translate.mjs

      # 译文作为 bot commit 回写 main：[skip ci] 防递归（GITHUB_TOKEN 的 push 本身也不会触发新 run）。
      # 本次运行接着用工作区里已翻译的文件构建，所以这次部署的内容已含译文；
      # 回写后 HEAD 即 bot commit，下面 build-data.mjs 取 `git rev-parse HEAD` 写进 build.json。
      - name: Commit machine translations back to main
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no translation changes to commit"
            exit 0
          fi
          git config user.name "canteenos-bot"
          git config user.email "canteenos-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore(i18n): machine translations [skip ci]"
          git push origin HEAD:main

      - name: Build @canteenos/core
        run: pnpm -C packages/core build

      - name: Gate — build-data --check --compare-snapshots
        # This job needs Worker artifacts before the real client–Worker contract cases.
        run: |
          set -e
          npm --prefix packages/worker run build
          node --test packages/web/test/e2e/team-meals/api-contract.test.mjs
          # Capture after the translation commit, then reuse this exact revision for output.
          TEAM_MEALS_SOURCE_REVISION="$(git rev-parse HEAD)"
          node scripts/build-data.mjs --target team-meals --check --revision "$TEAM_MEALS_SOURCE_REVISION"
          node scripts/build-data.mjs --target legacy-numeric --check --compare-snapshots --root test/fixtures/contracts/valid/golden --at 2026-10-03T00:00:00.000Z
          printf 'TEAM_MEALS_SOURCE_REVISION=%s\n' "$TEAM_MEALS_SOURCE_REVISION" >> "$GITHUB_ENV"

      - name: Build data (three sheets + build.json → packages/web/public/data/)
        run: |
          set -e
          node scripts/build-data.mjs --target team-meals --revision "${TEAM_MEALS_SOURCE_REVISION:?Missing checked source revision}" --out packages/web/public/data

      - name: Build web (vite → packages/web/dist/)
        run: pnpm -C packages/web build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
