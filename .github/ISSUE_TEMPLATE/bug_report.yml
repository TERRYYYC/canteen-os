name: Bug Report
description: 报告页面、工作流、数据、接口或文档缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请描述实际观察到的行为。只提交脱敏后的截图、请求和日志；不要公开 token、cookie、私有媒体、内部地址或本机私有路径。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 页面 / 日常工作流（packages/web）
        - 写入 / 发布 / 知识库网关（packages/worker）
        - 菜谱 / 食材 / 采用快照（data / schemas）
        - 采购计算 / 渲染器（packages/core）
        - 视频来源 / 解析契约（skills）
        - 文档 / 协作入口
        - 脚本 / CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 角色与受阻任务
      description: 谁在什么页面或命令中做什么？影响是看不懂、无法继续、保存失败还是数据不一致？
      placeholder: 帮厨打开已发布计划的备料页，查看有原文用量但不能换算的材料。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 写明应用版本或 commit、页面路由、系统/浏览器、语言、手机或桌面尺寸，以及服务模式；不确定的项写未知。
      placeholder: |
        应用版本 / commit：
        页面路由或命令：
        系统 / 浏览器 / 设备或视口：
        界面语言：zh / en / uk
        服务模式：公开只读 / 已连接写入服务 / 隔离工程测试 / 未知
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从可辨认的起点列出操作、必要前提和复现频率。无法稳定复现时写明已尝试的条件。
      placeholder: |
        前提：
        1.
        2.
        复现频率：
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 写出用户应该能看到或完成的行为；涉及合同可附仓库相对路径或 issue 链接。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据
      description: 附脱敏截图、错误文案、HTTP 状态、日志摘要或失败检查。区分实际观察与根因猜测，不公开私有资料。
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 关联任务与补充线索（可选）
      description: 已有 issue/PR、源码位置、临时绕行方式；建议修复不代替根因核实。
