name: Feature Request
description: 提议改进小团队的菜谱、排菜、备料或采购流程
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        当前目标和边界见 `docs/current-contract.md`。新提议先讨论需求与取舍；创建 issue 不代表方向已经批准。
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 菜谱知识库 / 来源复核 / 厨房核定
        - 菜单计划 / 固定版本采用 / 发布
        - 菜单阅读 / 原方备料
        - 人工采购清单 / 采购计算
        - 视频来源与候选导入
        - 三语 / 权限 / 离线 / 基础设施
        - 当前范围之外的提议（需要单独讨论）
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 角色、场景与问题
      description: 谁在完成哪项日常任务时遇到什么问题？提供实际例子或已有 issue，说明当前怎样处理。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 预期改变与范围
      description: 用户操作前后有什么变化？说明本次要做和暂不做的内容；涉及字段/API 时先描述合同变化，保留未知值和固定版本边界。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可观察的验收条件
      description: 用角色、操作、状态和结果描述怎样判断有效；页面可打开或测试通过不能代替实际任务可完成。
      placeholder: |
        - [ ] 在……前提下，……角色通过……操作可以……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案、依赖与开放问题（可选）
      description: 可附开源或产品参照及其来源/许可；列出关联 issue 和需要决策的取舍。已有开源能力也可以作为提议依据。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已检索现有 issue，并说明与当前工作合同的关系或范围变化
          required: true
        - label: 提议不要求复制受限许可代码或引入仓库禁止的依赖；外部参考将注明来源与许可
          required: true
