name: Feature Request
description: 提议新功能或模块能力
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 菜品知识库
        - 菜单计划→采购单引擎
        - 点餐/评分/反馈
        - 视频导入 skill
        - 跨模块 / 基础设施
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 场景故事
      description: 谁（角色）在什么场景下遇到什么痛点？参考 docs/prd.md 的角色定义
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案设想
      description: 如涉及数据结构，请先描述 schema 层变化（spec-first）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与开源参照（可选）
      description: 调研过的开源项目/商业产品做法；注意 AGPL/Commons Clause 项目只可借鉴概念
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已查阅 docs/research/ 调研报告，确认该功能不是已有开源项目的现成能力
          required: false
        - label: 该提议不涉及引入 copyleft 依赖
          required: true
