name: 菜品/食材数据贡献
description: 按 schema 贡献菜品（Dish）、食材（Ingredient）或供应商（Supplier）数据
title: "[Data] "
labels: ["data-contribution"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎贡献数据！维护者会把你的提交转换为符合 `schemas/` 的 JSON 并通过 CI 校验。
        字段定义见：schemas/dish.schema.json、schemas/ingredient.schema.json、schemas/supplier.schema.json。
  - type: dropdown
    id: entity
    attributes:
      label: 数据类型
      options:
        - Dish（菜品）
        - Ingredient（食材/调料）
        - Supplier（供应商 + SKU）
    validations:
      required: true
  - type: input
    id: name_zh
    attributes:
      label: 名称（中文 zh）
    validations:
      required: true
  - type: input
    id: name_en
    attributes:
      label: 名称（English）
      description: 内容级三语要求：至少提供一种语言，鼓励三语齐全
  - type: input
    id: name_uk
    attributes:
      label: 名称（Українська）
  - type: textarea
    id: payload
    attributes:
      label: 结构化数据
      description: 菜品请给出 baseServings、components（食材+用量+单位）、steps；食材请给出 category、isSeasoning、baseUnit、lossRate 等
      placeholder: |
        baseServings: 2
        components:
          - 番茄 300 g
          - 鸡蛋 3 pcs
        steps:
          1. 番茄切块……
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 数据来源
      options:
        - manual（人工录入/自有配方）
        - video-import（视频解析，请附 dishpack 或视频链接）
        - web-import（网页导入，请附链接）
    validations:
      required: true
  - type: input
    id: source_ref
    attributes:
      label: 来源引用（视频 URL / 网页 URL，可选）
  - type: checkboxes
    id: rights
    attributes:
      label: 权利确认
      options:
        - label: 我确认所提交数据不侵犯第三方版权（菜谱事实信息可自由提交；大段复制的文案请勿提交）
          required: true
