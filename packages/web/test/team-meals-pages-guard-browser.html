<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D guard composition — local fixture</title><style>body{margin:0;background:#f5f2ed;font:16px system-ui;color:#252b28}aside,main{max-width:1000px;margin:auto;padding:20px}aside{background:#e7efe9}button,select{font:inherit;margin:5px;padding:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#app{background:white;padding:20px}dialog{max-width:90vw}</style>
<aside><b>LOCAL TEST FIXTURE · No remote writes</b><p>Actual D renderers, C registry and PWA coordinator. Only API transport and the service-worker registration boundary are controlled. Browser reload and beforeunload are native; this fixture does not claim a native SW update.</p><label>Language <select id="language"><option>en</option><option>zh</option><option>uk</option></select></label><button id="prepare">Prepare scenario</button><button id="probe" disabled>Probe ordinary unload</button><button id="update" disabled>Show update</button><button id="lose">Lose pending response</button><button id="retire">Change auth and go Home</button><button id="ack">Release malformed ACK</button><pre id="result"></pre></aside><main id="app"><div id="outlet"></div></main>
<script type="module">
import '../src/styles.css';import '../src/pages/admin/admin.css';
import {render as ingredient} from '../src/pages/admin/ingredient-new';import {render as dish} from '../src/pages/admin/dish-new';import {render as paste} from '../src/pages/admin/import';import {render as publish} from '../src/pages/admin/publish';
import {initPwa} from '../src/pwa';import {createTeamMealsApi} from '../src/api/team-meals';import {HttpAdminApi} from '../src/api/client';import {clearToken} from '../src/admin/token';import {inspectReloadSafety,createPageReloadCoverage} from '../src/view-models/reload-safety';
const q=new URLSearchParams(location.search),scenario=q.get('case')??'ingredient-dirty',key='d-guard:'+location.search,A='a'.repeat(40),B='b'.repeat(40),defer=()=>{let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});return{resolve,reject,promise};};
const old=JSON.parse(sessionStorage.getItem(key)??'{}'),report={scenario,boot:(old.boot??0)+1,previous:old,sourceHashes:await(await fetch('/source-hashes.json')).json(),events:[],writes:0};sessionStorage.setItem(key,JSON.stringify(report));
let auth=0,lang='en',gate=null,callbacks,el,page=scenario.includes('dish')?'dish':scenario.includes('paste')?'paste':scenario.includes('publish')?'publish':'ingredient';
const ing={schemaVersion:'2',name:{zh:'盐',en:'Salt',uk:'Сіль'},baseUnit:'g',trackStock:false},recipe={schemaVersion:'3',name:{zh:'汤',en:'Soup',uk:'Суп'},status:'draft',components:[{ingredientRef:'salt'}]},plan={schemaVersion:'3',meals:[]};
const fetchLocal=async(url,init={})=>{const p=new URL(url).pathname;if(init.method&&init.method!=='GET'){report.writes++;paint();return gate?gate.promise:Response.json({ok:true,commit:B,blobSha:'explicit-local-blob',unchanged:false,warnings:[]});}return Response.json(p==='/catalog'?{commit:A,dishes:{soup:recipe},ingredients:{salt:ing},techniques:[],suppliers:[],translations:{}}:p==='/changes'?{onlineCommit:A,lastPublishedAt:'2026-09-10T00:00:00Z',unpublished:[{sha:B,at:'2026-09-11T00:00:00Z',role:'chef',endpoint:'POST /plan/week',subject:'Explicit fixture change',files:['data/menu-plans/week.json']}],publishes:[]}:p.startsWith('/source/ingredient')?{content:ing,commit:A,blobSha:'ingredient-a'}:p.startsWith('/source/dish')?{content:recipe,commit:A,blobSha:'dish-a'}:{content:plan,commit:A,blobSha:'plan-a'});};
const options={fetch:fetchLocal,identity:()=>auth,token:()=> 'explicit-local-fixture'},team=createTeamMealsApi('https://local-fixture.invalid',options),legacy=new HttpAdminApi('https://local-fixture.invalid',options);legacy.translate=async()=>({});
globalThis.fixture={team,legacy,register(options){callbacks=options;options.onRegisteredSW('explicit-fixture-registration',{waiting:null,update:async()=>{}});return async()=>{};}};
initPwa({refresh(){}},{refreshPublication:async()=>{}});const coverage=createPageReloadCoverage(),flush=async()=>{for(let n=0;n<8;n++)await new Promise(r=>setTimeout(r,0));};
function paint(){report.safety=inspectReloadSafety();document.querySelector('#result').textContent=JSON.stringify(report,null,2);sessionStorage.setItem(key,JSON.stringify(report));}
function input(selector,value){const n=el.querySelector(selector);if(!n)throw Error(selector);n.value=value;n.dispatchEvent(new Event('input',{bubbles:true}));}
function click(label){const b=[...el.querySelectorAll('button')].find(b=>b.textContent===label);if(!b)throw Error(label);b.click();}
async function mount(){const rest=page==='ingredient'?'salt':page==='dish'?'soup':page==='paste'?'week':'',path=page==='paste'?'plan/week/import':`${page}/${rest}`;location.hash='#/admin/'+path;window.dispatchEvent(new Event('hashchange'));el=document.createElement('section');document.querySelector('#outlet').replaceChildren(el);await({ingredient,dish,paste,publish}[page])(el,{lang,route:'admin',rest:path,planId:'week',data:{},t:k=>k,setReloadCoverage:coverage.beginRender('admin',path)},rest,team);await flush();paint();}
function retire(){auth++;clearToken();location.hash='#/admin';window.dispatchEvent(new Event('hashchange'));document.querySelector('#outlet').replaceChildren(document.createTextNode('Local fixture Home — read-only'));coverage.beginRender('admin','')('read-only');paint();}
async function prepare(){await mount();if(scenario.includes('dirty')||scenario.includes('retired'))input(page==='ingredient'?'#adm-ing-packSize':page==='dish'?'#adm-dish-baseServings':'#adm-import-text',page==='dish'?'12':'12,');if(scenario.includes('pending')||scenario.includes('ack')){gate=defer();if(scenario.includes('late'))legacy.saveIngredient=()=>{report.writes++;return gate.promise;};if(page==='ingredient'){input('#adm-ing-name-zh','Local submitted name');el.querySelector('form').dispatchEvent(new Event('submit',{cancelable:true}));}else if(page==='dish'&&scenario.includes('ack')){click('Add an ingredient');el.querySelector('.adm-dish-result-new').click();const inline=el.querySelector('.adm-dish-inline'),field=suffix=>[...inline.querySelectorAll('input')].find(n=>n.id.endsWith(suffix)).id;input('#'+field('-name-zh'),'Inline local ingredient');input('#'+field('-id'),'inline-local');click('Save this ingredient');}else if(page==='dish'){input('#adm-dish-name-zh','Local submitted soup');el.querySelector('.adm-dish-save-draft').click();}else el.querySelector('.adm-pub-publish').click();await flush();}if(scenario.includes('retired')||scenario.includes('late'))retire();report.prepared=true;document.querySelector('#probe').disabled=false;document.querySelector('#update').disabled=false;paint();}
document.querySelector('#prepare').onclick=async e=>{e.target.disabled=true;try{await prepare();}catch(error){report.error=String(error);paint();}};
document.querySelector('#language').onchange=async e=>{lang=e.target.value;await mount();report.hint=[...el.querySelectorAll('.adm-ing-hint')].map(n=>n.textContent).find(t=>/Packaging|包装信息|Дані про паковання/.test(t));paint();};
document.querySelector('#probe').onclick=()=>{const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);report.events.push({type:'probe',defaultPrevented:event.defaultPrevented,reason:inspectReloadSafety().reason});paint();};
document.querySelector('#update').onclick=()=>{callbacks.onNeedRefresh();paint();};document.querySelector('#retire').onclick=retire;
document.querySelector('#lose').onclick=async()=>{gate?.reject(new TypeError('Explicit local lost response'));await flush();paint();};
document.querySelector('#ack').onclick=async()=>{const ack={commit:[B],blobSha:'explicit-local-blob',unchanged:false,warnings:[]};gate?.resolve(scenario.includes('late')?ack:Response.json({ok:true,...ack}));await flush();report.inlinePresent=!!el?.querySelector('.adm-dish-inline');report.saveDisabled=!!el?.querySelector(page==='dish'?'.adm-dish-save-draft':'.adm-ing-save')?.disabled;paint();};
// Observes the native outcome; never prevents unload or grants approval.
window.addEventListener('beforeunload',event=>{if(event.isTrusted){report.nativeUnload={isTrusted:event.isTrusted,defaultPrevented:event.defaultPrevented,reason:inspectReloadSafety().reason};sessionStorage.setItem(key,JSON.stringify(report));}});
window.addEventListener('pagehide',()=>{report.pagehide=true;sessionStorage.setItem(key,JSON.stringify(report));});paint();
</script></html>
