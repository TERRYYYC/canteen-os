<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dish auxiliary operation checks · local fixture</title>
<style>body{margin:12px}button{min-height:44px}iframe{width:100%;height:550px;border:1px solid #ddd}pre{white-space:pre-wrap}#app{max-width:760px;margin:auto}</style>
<strong>Explicit local simulated transport · no repository writes</strong><button id="run">Run Dish auxiliary probes</button><pre id="results"></pre><div id="app"></div>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {render} from '../src/pages/admin/dish-new.ts';
import {getApi,HttpAdminApi} from '../src/api/client.ts';
import {createTeamMealsApi} from '../src/api/team-meals.ts';
import {clearToken} from '../src/admin/token.ts';
import {ApiError} from '../src/api/types.ts';
import {inspectReloadSafety,createPageReloadCoverage} from '../src/view-models/reload-safety.ts';
const A='a'.repeat(40),B='b'.repeat(40),app=document.querySelector('#app'),out=document.querySelector('#results'),tick=()=>new Promise(r=>setTimeout(r,30)),coverage=createPageReloadCoverage();
const pending=()=>{let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});return{promise,resolve,reject};};
const assert=(ok,message)=>{if(!ok)throw new Error(message);};const snapshot=()=>inspectReloadSafety();const reason=expected=>assert(snapshot().reason===expected,`${expected} expected: ${JSON.stringify(snapshot())}`);const aux=()=>snapshot().records.filter(r=>r.ownerId.startsWith('auxiliary-'));
const $=sel=>app.querySelector(sel),button=text=>[...app.querySelectorAll('button')].find(b=>b.textContent===text),input=(sel,value)=>{const f=$(sel);assert(f,sel);f.value=value;f.dispatchEvent(new Event('input',{bubbles:true}));};
const dish={schemaVersion:'3',name:{zh:'原汤',en:'Original Soup',uk:'Суп'},status:'draft'},catalog={commit:A,dishes:{soup:dish},ingredients:{},suppliers:[],techniques:[],translations:{machine:0,human:0,stale:0}};
function setup(){let identity=0;const holds={},writes=[],legacy=getApi(),api=createTeamMealsApi('https://dish-auxiliary.local.invalid',{token:()=> 'explicit-local-fixture',identity:()=>identity,fetch:async(url,init)=>{const path=new URL(url).pathname;if(holds[path])await holds[path].promise;if(init.method==='GET')return Response.json(path==='/catalog'?catalog:{content:dish,commit:A,blobSha:'dish-a'});writes.push({path,body:JSON.parse(init.body)});return Response.json({commit:B,blobSha:'dish-b',unchanged:false,warnings:[]});}});legacy.translate=async()=>({});legacy.uploadImage=async()=>({src:'data/dishes/soup/images/local.png',license:'own'});legacy.saveIngredient=async()=>({commit:B,blobSha:'ingredient-b',unchanged:false,warnings:[]});return{api,legacy,holds,writes,auth(){identity++;clearToken();}};}
function draw(s,rest='soup',lang='en'){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');app.replaceChildren(el);return render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k,setReloadCoverage:coverage.beginRender('admin','dish/'+rest)},rest,s.api);}
async function ready(s,rest='soup',lang='en'){await draw(s,rest,lang);await tick();}
async function until(fn){for(let i=0;i<100;i++){if(fn())return;await tick();}throw new Error('Timed out');}
async function selectPhoto(sel){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'local.png',{type:'image/png'}));$(sel).files=dt.files;$(sel).dispatchEvent(new Event('change',{bubbles:true}));}
async function photo(sel='#adm-dish-photo-pick',preview='.adm-dish-preview img'){await selectPhoto(sel);await until(()=>$(preview));}
async function inline(s){await ready(s);button('Add an ingredient').click();$('.adm-dish-result-new').click();input('#adm-dish-c1-ing-name-zh','新食材');input('#adm-dish-c1-ing-id','local-ingredient');}
const cases={
 'source-coverage':async()=>{const s=setup(),gate=s.holds['/source/dish/soup']=pending();try{const a=draw(s);reason('saving');s.auth();delete s.holds['/source/dish/soup'];await ready(s,'soup','uk');reason('unknown');input('#adm-dish-name-zh','B kept');gate.resolve();await a;await tick();reason('dirty');assert(!snapshot().records.some(r=>r.id==='previous-session-page'),'old render coverage finished');assert($('#adm-dish-name-zh').value==='B kept','B raw kept');}finally{gate.resolve();}},
 'catalog-read':async()=>{const s=setup(),gate=s.holds['/catalog']=pending();try{await draw(s);reason('saving');await draw(s,'soup','uk');reason('saving');gate.resolve();await tick();reason('clear');assert(aux().length===1,'one document auxiliary owner');}finally{gate.resolve();}},
 'photo-decode':async()=>{const s=setup();await ready(s);const Original=window.Image,releases=[];window.Image=class extends Original{set onload(fn){super.onload=e=>releases.push(()=>fn.call(this,e));}get onload(){return super.onload;}};try{await selectPhoto('#adm-dish-photo-pick');reason('saving');await until(()=>releases.length);await ready(s,'soup','uk');reason('saving');releases.splice(0).forEach(fn=>fn());await tick();reason('dirty');assert($('.adm-dish-preview img'),'photo current view');}finally{window.Image=Original;releases.splice(0).forEach(fn=>fn());}},
 'translation':async()=>{const s=setup(),gate=pending();try{await ready(s);s.legacy.translate=()=>gate.promise;button('Translate').click();reason('saving');await ready(s,'soup','uk');input('#adm-dish-name-en','User later English');gate.resolve({en:'Discarded',uk:'Суп'});await tick();reason('dirty');assert($('#adm-dish-name-en').value==='User later English','raw later English retained');}finally{gate.resolve({});}},
 'c1-no-duplicate':async()=>{const s=setup(),gate=s.holds['/dish/soup/draft']=pending();await ready(s);input('#adm-dish-name-zh','New name');$('.adm-dish-save-draft').click();await tick();const snap=snapshot();assert(aux().length===1,'raw owner is registered');assert(aux()[0].phase==='idle','no duplicate auxiliary write for C1 save');assert(snap.records.filter(r=>r.pending||r.phase==='saving'||r.phase==='busy').length===1,'C1 alone owns save');gate.resolve();await tick();},
 'inline-upload-save':async()=>{const s=setup(),upload=pending(),save=pending();let saves=0;try{await inline(s);await photo('#adm-dish-c1-ing-photo-pick','.adm-ing-preview img');s.legacy.uploadImage=()=>upload.promise;s.legacy.saveIngredient=async()=>{saves++;return save.promise;};button('Save this ingredient').click();reason('saving');upload.resolve({src:'data/ingredients/local-ingredient/images/local.png',license:'own'});await tick();reason('saving');assert(saves===1,'inline save follows upload');save.reject(new ApiError(409,'conflict','known rejection'));await tick();reason('dirty');assert(aux().every(r=>r.phase==='idle'),'each known terminal write settled');}finally{upload.resolve({src:'data/ingredients/local-ingredient/images/local.png',license:'own'});save.resolve({commit:B,blobSha:'ingredient-b',unchanged:false,warnings:[]});}},
 'two-old-uploads':async()=>{const s=setup(),one=pending(),two=pending();let count=0;try{s.legacy.uploadImage=()=>++count===1?one.promise:two.promise;await ready(s);await photo();$('.adm-dish-save-draft').click();await tick();await ready(s,'other');await photo();$('.adm-dish-save-draft').click();await tick();reason('saving');assert(count===2,'two detached owners');s.auth();await ready(s,'soup','uk');reason('unknown');one.resolve({src:'data/dishes/soup/images/known.png',license:'own'});await tick();reason('unknown');two.reject(new ApiError(409,'conflict','known rejection'));await tick();reason('clear');assert(s.writes.length===0,'old uploads never save B');}finally{one.resolve({src:'data/dishes/soup/images/known.png',license:'own'});two.resolve({src:'data/dishes/other/images/known.png',license:'own'});}},
 'hidden-inline-ack':async()=>{const s=setup(),gate=pending(),http=new HttpAdminApi('https://dish-inline-http.local.invalid',{token:()=> 'explicit-local-fixture',fetch:async()=>{await gate.promise;return Response.json({src:'data/ingredients/local-ingredient/images/accepted.png',license:'own'});}});let saves=0;try{await inline(s);await photo('#adm-dish-c1-ing-photo-pick','.adm-ing-preview img');s.legacy.uploadImage=http.uploadImage.bind(http);s.legacy.saveIngredient=async()=>{saves++;return{commit:B,blobSha:'ingredient-b',unchanged:false,warnings:[]};};button('Save this ingredient').click();reason('saving');s.auth();await ready(s,'soup','uk');reason('unknown');gate.resolve();await tick();reason('unknown');assert(snapshot().records.some(r=>r.id==='previous-session-operation'),'anonymous old write retained');assert(saves===0,'no inline save issued under B');}finally{gate.resolve();http.dispose();}}
};
const chosen=new URL(location.href).searchParams.get('case');
if(chosen){document.querySelector('#run').hidden=true;let result;try{await cases[chosen]();result={name:chosen,passed:true,snapshot:snapshot()};}catch(error){result={name:chosen,passed:false,error:String(error.stack??error),snapshot:snapshot()};}out.textContent=JSON.stringify(result,null,2);parent.postMessage({dishAuxiliaryResult:result},location.origin);}
else document.querySelector('#run').onclick=async()=>{const results=[];document.querySelector('#run').disabled=true;for(const name of Object.keys(cases)){const frame=document.createElement('iframe');const result=new Promise(resolve=>{const listen=e=>{if(e.source!==frame.contentWindow||!e.data?.dishAuxiliaryResult)return;window.removeEventListener('message',listen);resolve(e.data.dishAuxiliaryResult);};window.addEventListener('message',listen);});frame.src=location.pathname+'?case='+name;app.replaceChildren(frame);results.push(await result);out.textContent=JSON.stringify({summary:`${results.filter(r=>r.passed).length}/${results.length}`,results},null,2);}document.querySelector('#run').disabled=false;};
</script></html>
