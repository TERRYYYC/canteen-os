<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Dish pending task checks</title><p>Explicit local mock only · no external writes</p><button id="run-review">Run pending task probes</button><pre id="review-result"></pre><div id="app"></div><script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {ApiError} from '../src/api/types.ts';
import {render} from '../src/pages/admin/dish-new.ts';import {getApi} from '../src/api/client.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30));const results=[];
const dish={schemaVersion:'3',name:{zh:'原来的汤',en:'Original soup'},status:'active'};
function setup(mode='mock'){const writes=[];const api={mode,sessionKey:()=>0,peekSessionKey:()=>0,getDish:async id=>({content:structuredClone(dish),commit:A,blobSha:'blob-a'}),getCatalog:async()=>({commit:A,dishes:{soup:dish},ingredients:{},techniques:[],suppliers:[],translations:{}}),saveDish:async(id,body,condition)=>{writes.push({id,body,condition});return{commit:B,blobSha:'blob-b',unchanged:false,warnings:[]};}};api.saveDishDraft=api.saveDish;return{api,writes};}
async function draw(api,rest='soup',lang='en'){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,api);await tick();}
const findButton=label=>[...document.querySelectorAll('#app button')].find(x=>x.textContent===label);
const set=(sel,val)=>{const e=document.querySelector(sel);if(!e)throw new Error('missing '+sel);e.value=val;e.dispatchEvent(new Event('input',{bubbles:true}));};
const status=()=>document.querySelector('.adm-dish-edit-state')?.textContent;
function unloadWarning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
async function photo(inputSelector='#adm-dish-photo-pick',previewSelector='.adm-dish-preview img'){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const transfer=new DataTransfer();transfer.items.add(new File([blob],'review.png',{type:'image/png'}));const input=document.querySelector(inputSelector);input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));for(let i=0;i<20&&!document.querySelector(previewSelector);i++)await tick();if(!document.querySelector(previewSelector))throw new Error('photo not ready');}

function report(name,passed,detail){results.push({name,passed,...detail});document.querySelector('#review-result').textContent=JSON.stringify(results,null,2);}
function errors(){return [...document.querySelectorAll('#app .adm-field-error:not([hidden]),#app .adm-form-errors')].map(x=>x.textContent);}
async function inline(api){await draw(api);findButton('Add an ingredient').click();document.querySelector('.adm-dish-result-new').click();}

function holdDecode(){const Original=window.Image;const releases=[];window.Image=class extends Original{set onload(fn){super.onload=event=>releases.push(()=>fn.call(this,event));}get onload(){return super.onload;}};return{releases,finish(){window.Image=Original;releases.splice(0).forEach(fn=>fn());}};}
async function selectPhoto(selector){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'pending.png',{type:'image/png'}));const input=document.querySelector(selector);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}
async function until(fn){for(let i=0;i<100;i++){if(fn())return;await tick();}throw new Error('condition not reached');}
async function caseOf(name,fn){try{await fn();}catch(error){report(name,false,{error:String(error.stack)});}}
document.querySelector('#run-review').onclick=async()=>{
 results.length=0;const aux=getApi(),oldTranslate=aux.translate;
 await caseOf('main photo',async()=>{const s=setup('real');await draw(s.api);const decode=holdDecode();try{await selectPhoto('#adm-dish-photo-pick');report('main photo decode blocks save immediately',document.querySelector('.adm-dish-save-draft').disabled&&unloadWarning(),{});await until(()=>decode.releases.length);await draw(s.api,'soup','uk');report('main photo decode remains busy after language redraw',document.querySelector('.adm-dish-save-draft').disabled,{});decode.finish();await tick();report('decoded main photo reaches its current view',!!document.querySelector('.adm-dish-preview img')&&unloadWarning(),{writes:s.writes.length});}finally{decode.finish();}});
 await caseOf('inline photo',async()=>{const s=setup('real');await inline(s.api);const decode=holdDecode();try{await selectPhoto('#adm-dish-c1-ing-photo-pick');report('inline photo decode blocks save immediately',document.querySelector('.adm-dish-save-draft').disabled,{});await until(()=>decode.releases.length);await draw(s.api,'soup','uk');decode.finish();await tick();report('decoded inline photo reaches its current form',!!document.querySelector('.adm-ing-preview img')&&unloadWarning(),{writes:s.writes.length});}finally{decode.finish();}});
 await caseOf('main translation',async()=>{const s=setup('real');await draw(s.api);let release,calls=0;aux.translate=async()=>{calls++;return new Promise(r=>release=r);};findButton('Translate').click();await tick();report('main translation blocks save during its pending result',document.querySelector('.adm-dish-save-draft').disabled,{});set('#adm-dish-name-en','User later English');release({en:'Old translated English',uk:'Суп'});await tick();report('manual translation cannot replace later raw English',document.querySelector('#adm-dish-name-en').value==='User later English',{value:document.querySelector('#adm-dish-name-en').value,calls});});
 await caseOf('main translation language',async()=>{const s=setup('real');await draw(s.api);let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();await draw(s.api,'soup','uk');release({en:'Result after language switch',uk:'Новий переклад'});await tick();report('unchanged translation completes in the current language form',document.querySelector('#adm-dish-name-en').value==='Result after language switch'&&!document.querySelector('.adm-dish-save-draft').disabled,{value:document.querySelector('#adm-dish-name-en').value});});
 await caseOf('inline translation',async()=>{const s=setup('real');await inline(s.api);set('#adm-dish-c1-ing-name-zh','原料');let release,calls=0;aux.translate=async()=>{calls++;return new Promise(r=>release=r);};document.querySelector('.adm-dish-inline .adm-ing-translate').click();await tick();await draw(s.api,'soup','uk');report('inline translation remains owned through language redraw',document.querySelector('.adm-dish-save-draft').disabled&&calls===1,{calls});release({en:'Owned ingredient',uk:'Інгредієнт'});await tick();report('inline translated result reaches current form',document.querySelector('#adm-dish-c1-ing-name-en').value==='Owned ingredient'&&!document.querySelector('.adm-dish-save-draft').disabled,{value:document.querySelector('#adm-dish-c1-ing-name-en').value});});
 await caseOf('main photo detached',async()=>{const s=setup('real');await draw(s.api);const decode=holdDecode();try{await selectPhoto('#adm-dish-photo-pick');await until(()=>decode.releases.length);await draw(s.api,'new');decode.finish();await tick();const otherHasPhoto=!!document.querySelector('.adm-dish-preview img');await draw(s.api,'soup');report('detached decode stays with its original dish',!otherHasPhoto&&!!document.querySelector('.adm-dish-preview img')&&s.writes.length===0,{otherHasPhoto,writes:s.writes.length});}finally{decode.finish();}});
 await caseOf('photo auth',async()=>{const s=setup('real');let auth=0;s.api.sessionKey=()=>auth;s.api.peekSessionKey=()=>auth;await draw(s.api);const decode=holdDecode();try{await selectPhoto('#adm-dish-photo-pick');await until(()=>decode.releases.length);auth++;await draw(s.api);decode.finish();await tick();report('old-auth decode cannot enter the replacement form',!document.querySelector('.adm-dish-preview img')&&s.writes.length===0,{writes:s.writes.length});}finally{decode.finish();}});
 await caseOf('photo decode failure',async()=>{const s=setup('real');await draw(s.api);await photo();const src=document.querySelector('.adm-dish-preview img').getAttribute('src');const dt=new DataTransfer();dt.items.add(new File(['not a PNG'],'broken.png',{type:'image/png'}));const field=document.querySelector('#adm-dish-photo-pick');field.files=dt.files;field.dispatchEvent(new Event('change',{bubbles:true}));await tick();await tick();report('decode failure keeps the previous photo and releases busy',document.querySelector('.adm-dish-preview img')?.getAttribute('src')===src&&!document.querySelector('.adm-dish-save-draft').disabled&&status().includes("Can't open this image"),{status:status()});});
 aux.translate=oldTranslate;
};
</script>
