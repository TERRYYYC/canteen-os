<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Dish validation repair checks</title><p>Explicit local mock only · no external writes</p><button id="run-review">Run independent probes</button><pre id="review-result"></pre><div id="app"></div><script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {ApiError} from '../src/api/types.ts';
import {render} from '../src/pages/admin/dish-new.ts';import {getApi} from '../src/api/client.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30));const results=[];
const dish={schemaVersion:'3',name:{zh:'原来的汤',en:'Original soup'},status:'active'};
function setup(mode='mock'){const writes=[];const api={mode,sessionKey:()=>0,getDish:async id=>({content:structuredClone(dish),commit:A,blobSha:'blob-a'}),getCatalog:async()=>({commit:A,dishes:{soup:dish},ingredients:{},techniques:[],suppliers:[],translations:{}}),saveDish:async(id,body,condition)=>{writes.push({id,body,condition});return{commit:B,blobSha:'blob-b',unchanged:false,warnings:[]};}};api.saveDishDraft=api.saveDish;return{api,writes};}
async function draw(api,rest='soup',lang='en'){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,api);await tick();}
const findButton=label=>[...document.querySelectorAll('#app button')].find(x=>x.textContent===label);
const set=(sel,val)=>{const e=document.querySelector(sel);if(!e)throw new Error('missing '+sel);e.value=val;e.dispatchEvent(new Event('input',{bubbles:true}));};
const status=()=>document.querySelector('.adm-dish-edit-state')?.textContent;
function unloadWarning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
async function photo(inputSelector='#adm-dish-photo-pick',previewSelector='.adm-dish-preview img'){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const transfer=new DataTransfer();transfer.items.add(new File([blob],'review.png',{type:'image/png'}));const input=document.querySelector(inputSelector);input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));for(let i=0;i<20&&!document.querySelector(previewSelector);i++)await tick();if(!document.querySelector(previewSelector))throw new Error('photo not ready');}

function report(name,passed,detail){results.push({name,passed,...detail});document.querySelector('#review-result').textContent=JSON.stringify(results,null,2);}
function errors(){return [...document.querySelectorAll('#app .adm-field-error:not([hidden]),#app .adm-form-errors')].map(x=>x.textContent);}
async function inline(api){await draw(api);findButton('Add an ingredient').click();document.querySelector('.adm-dish-result-new').click();}
document.querySelector('#run-review').onclick=async()=>{try{
 const aux=getApi(),oldSave=aux.saveIngredient,oldUpload=aux.uploadImage;
 const one=setup('real');await inline(one.api);let writes=0;aux.saveIngredient=async()=>{writes++;throw new Error('should not reach network');};findButton('Save this ingredient').click();await tick();
 report('inline local ID error survives auxiliary completion',document.querySelector('#adm-dish-c1-ing-id')?.getAttribute('aria-invalid')==='true'&&errors().length>0,{writes,errors:errors(),idInvalid:document.querySelector('#adm-dish-c1-ing-id')?.getAttribute('aria-invalid'),inlinePresent:!!document.querySelector('.adm-dish-inline')});
 const two=setup('real');await inline(two.api);set('#adm-dish-c1-ing-id','review-ingredient');set('#adm-dish-c1-ing-name-zh','测试');aux.saveIngredient=async()=>{throw new ApiError(400,'minLength','Invalid ingredient',[{path:'/name/zh',code:'minLength',message:'Name needs at least two letters'}]);};findButton('Save this ingredient').click();await tick();
 report('inline server field error survives auxiliary completion',errors().some(e=>e.includes('Name needs at least two letters'))&&document.querySelector('#adm-dish-c1-ing-name-zh')?.getAttribute('aria-invalid')==='true',{errors:errors(),nameInvalid:document.querySelector('#adm-dish-c1-ing-name-zh')?.getAttribute('aria-invalid'),status:status()});
 await draw(two.api,'soup','uk');
 report('server field error survives language repaint',errors().some(e=>e.includes('Name needs at least two letters'))&&document.querySelector('#adm-dish-c1-ing-name-zh')?.getAttribute('aria-invalid')==='true',{errors:errors()});
 const delayed=setup('real');await inline(delayed.api);set('#adm-dish-c1-ing-id','delayed-ingredient');set('#adm-dish-c1-ing-name-zh','测试');let finishDelayed;
 aux.saveIngredient=async()=>{await new Promise(r=>finishDelayed=r);throw new ApiError(400,'minLength','Invalid ingredient',[{path:'/name/zh',code:'minLength',message:'Delayed name field error'}]);};findButton('Save this ingredient').click();await tick();await draw(delayed.api,'soup','uk');finishDelayed();await tick();
 report('late server field errors reach the current language form',errors().some(e=>e.includes('Delayed name field error'))&&document.querySelector('#adm-dish-c1-ing-name-zh')?.getAttribute('aria-invalid')==='true',{errors:errors()});
 const local=setup('real');await inline(local.api);findButton('Save this ingredient').click();await tick();await draw(local.api,'soup','uk');
 report('local error is revalidated in the current language',document.querySelector('#adm-dish-c1-ing-id')?.getAttribute('aria-invalid')==='true'&&errors().length>0,{errors:errors()});
 const generic=setup('real');await inline(generic.api);set('#adm-dish-c1-ing-id','generic-ingredient');set('#adm-dish-c1-ing-name-zh','测试');let genericWrites=0;aux.saveIngredient=async()=>{genericWrites++;throw new ApiError(409,'conflict','Inline conflict');};findButton('Save this ingredient').click();await tick();await draw(generic.api,'soup','uk');
 report('generic recoverable error and retry survive repaint',!!document.querySelector('.adm-dish-inline-msg [role="alert"]')&&!!document.querySelector('.adm-dish-inline-msg button')&&genericWrites===1,{message:document.querySelector('.adm-dish-inline-msg')?.textContent,writes:genericWrites});
 aux.saveIngredient=async()=>{genericWrites++;return{commit:B,blobSha:'ingredient-ok',unchanged:false,warnings:[]};};document.querySelector('.adm-dish-inline-msg button')?.click();await tick();await tick();
 report('explicit retry consumes the inline buffer once',genericWrites===2&&!document.querySelector('.adm-dish-inline'),{writes:genericWrites});
 const uploadField=setup('real');await inline(uploadField.api);set('#adm-dish-c1-ing-id','upload-ingredient');set('#adm-dish-c1-ing-name-zh','测试');await photo('#adm-dish-c1-ing-photo-pick','.adm-ing-preview img');
 aux.uploadImage=async()=>{throw new ApiError(400,'required','Invalid photo',[{path:'/license',code:'required',message:'Please check this photo license'}]);};findButton('Save this ingredient').click();await tick();await draw(uploadField.api,'soup','uk');
 report('upload field error remains attached to its preserved photo',errors().some(e=>e.includes('Please check this photo license'))&&document.querySelector('#adm-dish-c1-ing-image-license')?.getAttribute('aria-invalid')==='true'&&!!document.querySelector('.adm-ing-preview img'),{errors:errors()});
 const three=setup('real');await draw(three.api);await photo();let releases=[],uploads=0;aux.uploadImage=async()=>{uploads++;await new Promise(r=>releases.push(r));return{src:'data/dishes/soup/images/review.png',license:'own'};};document.querySelector('.adm-dish-save-draft').click();await tick();set('#adm-dish-name-zh','编辑期间新增名字');await draw(three.api,'soup','uk');releases.forEach(r=>r());await tick();await tick();
 report('late raw edits survive photo upload and save acknowledgement',uploads===1&&three.writes.length===1&&three.writes[0].body.name.zh==='原来的汤'&&document.querySelector('#adm-dish-name-zh').value==='编辑期间新增名字'&&unloadWarning(),{uploads,writes:three.writes,rawName:document.querySelector('#adm-dish-name-zh').value,dirty:unloadWarning()});
 const four=setup('real');await draw(four.api);await photo();let release;uploads=0;aux.uploadImage=async()=>{uploads++;await new Promise(r=>release=r);return{src:'data/dishes/soup/images/review.png',license:'own'};};document.querySelector('.adm-dish-save-draft').click();await tick();await draw(four.api,'new');release();await tick();await draw(four.api,'soup');const before=four.writes.length;document.querySelector('.adm-dish-save-draft').click();await tick();
 report('detached photo completion retained and reused without duplicate upload',uploads===1&&before===0&&four.writes.length===1&&four.writes[0].body.image?.src==='data/dishes/soup/images/review.png',{uploads,writesBeforeReturnSave:before,writes:four.writes});
 const five=setup('real');await draw(five.api);await photo();uploads=0;aux.uploadImage=async()=>{uploads++;throw new TypeError('upload response lost');};document.querySelector('.adm-dish-save-draft').click();await tick();await draw(five.api,'soup','uk');const blocked=document.querySelector('.adm-dish-save-draft').disabled;document.querySelector('.adm-dish-save-draft').click();await tick();
 report('unknown auxiliary upload preserves photo and stays protected',uploads===1&&blocked&&unloadWarning()&&!!document.querySelector('.adm-dish-preview img'),{uploads,blocked,dirty:unloadWarning(),photoPresent:!!document.querySelector('.adm-dish-preview img'),status:status()});
 aux.saveIngredient=oldSave;aux.uploadImage=oldUpload;
}catch(e){report('probe error',false,{message:e.stack});}};
</script>
