<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingredient review regressions · local mock</title>
<style>body{margin:0}#controls{padding:12px;background:#ffeac5}#controls button{min-height:44px;margin:4px}#app{max-width:760px;margin:auto}#results{white-space:pre-wrap;margin:16px}</style>
<div id="controls"><strong>Local simulated transport · no real repository writes</strong><button id="run">Run ingredient browser probes</button></div><div id="app"></div><pre id="results" aria-live="polite"></pre>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {ApiError} from '../src/api/types.ts';
import {setHandoff} from '../src/admin/store.ts';
import {render} from '../src/pages/admin/ingredient-new.ts';
import {getApi} from '../src/api/client.ts';import {createTeamMealsApi} from '../src/api/team-meals.ts';import {clearToken} from '../src/admin/token.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30)),results=[];
const app=document.querySelector('#app'),out=document.querySelector('#results');
const pending=()=>{let resolve;const promise=new Promise(r=>resolve=r);return{promise,resolve};};
const assert=(value,message)=>{if(!value)throw new Error(message);};
const set=(selector,value)=>{const field=app.querySelector(selector);assert(field,selector);field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));};
const submit=()=>app.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
const button=label=>[...app.querySelectorAll('button')].find(n=>n.textContent===label);
function warning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
function setup(mode='real'){
 let identity=0;let current={content:{schemaVersion:'2',name:{zh:'盐',en:'Salt',uk:'Сіль'},baseUnit:'g',role:'seasoning',trackStock:false},commit:A,blobSha:'salt-a'};
 const reads=[],writes=[],uploads=[],legacyReads=[];const legacy=getApi();
 legacy.getCatalog=async()=>{legacyReads.push('catalog');throw new Error('legacy catalog must not run');};legacy.getIngredient=async()=>{legacyReads.push('ingredient');throw new Error('legacy ingredient read must not run');};legacy.translate=async()=>({});
 const api=createTeamMealsApi(mode==='unconfigured'?'':'https://ingredient.local.invalid',{mode:mode==='mock'?'mock':'real',identity:()=>identity,token:()=> 'explicit-local-fixture',fetch:async url=>{const path=new URL(url).pathname;reads.push(path);const body=path==='/catalog'?{commit:A,dishes:{soup:{schemaVersion:'3',name:{zh:'汤'}}},ingredients:{salt:current.content},suppliers:['Mixed v3 supplier'],techniques:[],translations:{machine:0,human:0,stale:0}}:structuredClone(current);return new Response(JSON.stringify(body));}});
 legacy.saveIngredient=async(id,body,condition)=>{writes.push(structuredClone({id,body,condition}));current={content:structuredClone(body),commit:B,blobSha:'salt-b'};return{commit:B,blobSha:'salt-b',unchanged:false,warnings:[]};};
 legacy.uploadImage=async(...args)=>{uploads.push(args);return{src:'data/ingredients/salt/images/local.png',license:'own'};};
 return{api,legacy,reads,writes,uploads,legacyReads,bump(){identity++;},setCurrent(value){current=value;}};
}
async function draw(s,rest='salt',lang='en'){location.hash='#/admin/ingredient/'+rest;const el=document.createElement('section');app.replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,s.api);await tick();return el;}
async function leave(){location.hash='#/admin';app.replaceChildren(document.createTextNode('Other page'));await tick();}
async function photo(){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'local.png',{type:'image/png'}));const input=app.querySelector('#adm-ing-photo-pick');input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));const busyImmediately=app.querySelector('.adm-ing-save').disabled;for(let n=0;n<20&&!app.querySelector('.adm-ing-preview');n++)await tick();assert(app.querySelector('.adm-ing-preview'),'photo decode not ready');return busyImmediately;}
async function run(name,fn){try{const detail=await fn();results.push({name,passed:true,...detail});}catch(error){results.push({name,passed:false,error:String(error.stack??error)});}out.textContent=JSON.stringify(results,null,2);}

function check(name,passed,detail){results.push({name,passed,...detail});out.textContent=JSON.stringify(results,null,2);}
document.querySelector('#run').onclick=async()=>{try{
 results.length=0;
 const next=setup();await draw(next,'new');set('#adm-ing-name-zh','第一种食材');set('#adm-ing-id','ingredient-a');submit();await tick();await tick();await leave();await draw(next,'new');
 const reopened={id:app.querySelector('#adm-ing-id').value,name:app.querySelector('#adm-ing-name-zh').value,readonly:app.querySelector('#adm-ing-id').readOnly,heading:app.querySelector('h2')?.textContent};set('#adm-ing-name-zh','第二种食材');set('#adm-ing-id','ingredient-b');submit();await tick();
 check('successful creation permits a distinct next new ingredient',reopened.id===''&&!reopened.readonly&&next.writes.length===2&&next.writes[0].id==='ingredient-a'&&next.writes[1].id==='ingredient-b'&&!next.writes[1].condition,{reopened,writes:next.writes});
 const conflict=setup();await draw(conflict);await photo();let uploads=0;conflict.legacy.uploadImage=async()=>{uploads++;if(uploads===1)throw new ApiError(409,'conflict','Image ref contention');return{src:'data/ingredients/salt/images/recovered.png',license:'own'};};submit();await tick();const phase=app.querySelector('.adm-ing-owner-state').dataset.phase;const readCount=conflict.reads.length;button('Read remote version')?.click();const compareButtons=[...app.querySelectorAll('.adm-ing-owner-state button')];if(compareButtons.length)compareButtons[0].click();await tick();const afterCompare=conflict.reads.length;await leave();await draw(conflict);submit();await tick();
 check('recognized rejected upload can recover without false source comparison',!app.querySelector('.adm-ing-save').disabled&&uploads===2&&conflict.writes.length===1,{phase,uploads,writes:conflict.writes.length,readCount,afterCompare,disabledAfterReturn:app.querySelector('.adm-ing-save').disabled,text:app.querySelector('.adm-ing-owner-state').textContent});
 const field=setup();await draw(field);await photo();let fieldUploads=0;field.legacy.uploadImage=async()=>{fieldUploads++;if(fieldUploads===1)throw new ApiError(400,'required','Bad license',[{path:'/license',code:'required',message:'Fix this license'}]);return{src:'data/ingredients/salt/images/local.png',license:'own'};};submit();await tick();await draw(field,'salt','uk');const shown=app.textContent.includes('Fix this license')&&app.querySelector('#adm-ing-image-license').getAttribute('aria-invalid')==='true';set('#adm-ing-image-license','CC BY 4.0');submit();await tick();await tick();check('known upload field rejection retains field error and allows explicit correction',shown&&fieldUploads===2&&field.writes.length===1,{shown,fieldUploads,writes:field.writes.length});
 const malformed=setup();await draw(malformed);await photo();let malformedUploads=0;malformed.legacy.uploadImage=async()=>{malformedUploads++;return{};};submit();await tick();await leave();await draw(malformed);submit();await tick();check('malformed upload acknowledgement stays unknown without save or retry',malformedUploads===1&&malformed.writes.length===0&&app.querySelector('.adm-ing-owner-state').dataset.phase==='unknown'&&app.querySelector('.adm-ing-save').disabled,{malformedUploads,writes:malformed.writes.length});

 const hand=setup();await draw(hand,'new');set('#adm-ing-name-zh','第一项');set('#adm-ing-id','first-hand');submit();await tick();await tick();await draw(hand,'new','uk');check('language repaint keeps acknowledged new record',app.querySelector('#adm-ing-id').value==='first-hand',{id:app.querySelector('#adm-ing-id').value});await leave();setHandoff({newIngredientName:'待补食材',returnTo:'#/admin/dish/soup'});await draw(hand,'new');check('new handoff is consumed after completed creation',app.querySelector('#adm-ing-name-zh').value==='待补食材'&&!app.querySelector('#adm-ing-id').readOnly&&app.textContent.includes('Save and go back'),{visibleName:app.querySelector('#adm-ing-name-zh').value});
 const later=setup(),held=pending(),normal=later.legacy.saveIngredient;later.legacy.saveIngredient=async(...args)=>{const result=await normal(...args);await held.promise;return result;};await draw(later,'new');set('#adm-ing-name-zh','点击时名字');set('#adm-ing-id','pending-new');submit();await tick();await leave();await draw(later,'new','uk');const blocked=app.querySelector('.adm-ing-save').disabled;set('#adm-ing-name-zh','保存期间新名字');await leave();held.resolve();await tick();await draw(later,'new');const preserved=app.querySelector('#adm-ing-name-zh').value==='保存期间新名字'&&app.querySelector('#adm-ing-id').value==='pending-new';submit();await tick();check('pending new and later raw edits retain original target and If-Match',blocked&&preserved&&later.writes.length===2&&later.writes[1].id==='pending-new'&&later.writes[1].condition.ifMatch==='salt-b',{blocked,preserved,writes:later.writes});
 const unknown=setup();let unknownWrites=0;unknown.legacy.saveIngredient=async()=>{unknownWrites++;throw new TypeError('local response lost');};await draw(unknown,'new');set('#adm-ing-name-zh','未知提交');set('#adm-ing-id','unknown-new');submit();await tick();await leave();await draw(unknown,'new');submit();await tick();check('unknown new retains its target and blocks repeated creation write',unknownWrites===1&&app.querySelector('#adm-ing-id').value==='unknown-new'&&app.querySelector('.adm-ing-save').disabled,{unknownWrites,id:app.querySelector('#adm-ing-id').value,phase:app.querySelector('.adm-ing-owner-state').dataset.phase});
}catch(error){check('probe exception',false,{message:String(error.stack??error)});}};
</script></html>
