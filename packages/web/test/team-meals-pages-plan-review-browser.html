<!doctype html><html><head><meta charset="utf-8"><title>Independent repaired plan review — early save</title></head><body><button id="run">Run independent review probes</button><pre id="result"></pre><main id="app"></main>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {createPlanRenderer} from '../src/pages/admin/plan.ts';
import {createTeamMealsApi} from '../src/api/team-meals.ts';
import {setDraftPlan,clearDraftPlan} from '../src/admin/store.ts';
const A='a'.repeat(40), B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,15));
const plan=(dish='soup',n=12)=>({schemaVersion:'3',meals:[{date:'2026-10-05',mealType:'lunch',dishRef:dish,plannedServings:n}]});
const source=(content,commit=A)=>({content,commit,blobSha:'blob-'+commit[0]});
const catalog=(commit=A)=>({commit,dishes:commit===A?{soup:{name:{en:'Soup A'},components:[]}}:{newdish:{name:{en:'New dish B'},components:[]}},ingredients:{},techniques:[],suppliers:[],translations:{}});
function ok(body){return new Response(JSON.stringify(body),{status:200,headers:{'Content-Type':'application/json'}});}
function bad(status,code){return new Response(JSON.stringify({ok:false,errors:[{path:'',code,message:''}]}),{status,headers:{'Content-Type':'application/json'}});}
function setup(handler){const log=[];const api=createTeamMealsApi('https://independent-mock.invalid',{mode:'mock',token:()=>'explicit-review-mock',identity:()=>1,fetch:async(url,init)=>{const u=new URL(url);log.push({method:init.method,path:u.pathname,revision:u.searchParams.get('revision')});return handler(u,init);}});return {render:createPlanRenderer(api),log};}
async function draw(render,id='week-a',lang='en'){const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);const promise=render(el,{lang,planId:id,route:'admin',rest:id,data:{},t:k=>k},id);return promise;}
function button(label){return [...document.querySelectorAll('#app button')].find(b=>b.textContent===label);}
function set(value){const e=document.querySelector('[data-focus="servings-0"]');e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));}
const results=[];function report(name,details){results.push({name,...details});document.querySelector('#result').textContent=JSON.stringify(results,null,2);}
document.querySelector('#run').onclick=async()=>{
 results.length=0;
 try{
  let bReads=0;
  const one=setup((u)=>u.pathname==='/catalog'?ok(catalog(u.searchParams.get('revision')||A)):u.pathname.endsWith('/week-b')?(++bReads===1?bad(503,'upstream_unavailable'):ok(source(plan('newdish',3),B))):ok(source(plan())));
  await draw(one.render);await draw(one.render,'week-b');button('Read again').click();await tick();
  report('retry source after switching A to failed B',{bReads,rows:document.querySelectorAll('[data-meal-index]').length,body:document.querySelector('#app').textContent,log:one.log});
  let release;const held=new Promise(r=>release=r);
  setDraftPlan('week-import',{schemaVersion:'2',meals:[{date:'2026-10-05',mealType:'lunch',dishRef:'soup',plannedServings:2}]},'import');
  const two=setup(async u=>u.pathname==='/catalog'?(await held,ok(catalog())):ok(source(plan())));
  const pending=draw(two.render,'week-import');await tick();set('9');release();await pending;
  report('edit while imported draft waits for catalog',{expectedLatestCount:'9',actualCount:document.querySelector('[data-focus="servings-0"]').value,phase:document.querySelector('[data-phase]').dataset.phase});clearDraftPlan('week-import');
  let remote=false;
  const three=setup((u,init)=>{if(init.method==='POST'){remote=true;return bad(409,'conflict');}return u.pathname==='/catalog'?ok(catalog(u.searchParams.get('revision')||A)):ok(source(remote?plan('newdish',4):plan(),remote?B:A));});
  await draw(three.render,'week-conflict');set('13');button('Save plan').click();await tick();button('Read remote and compare').click();await tick();button('Use remote content').click();await tick();
  report('catalog after adopting conflict source B',{dish:document.querySelector('[data-focus="dish-0"]').selectedOptions[0].textContent,source:document.querySelector('[data-phase]').textContent,log:three.log});
  let releaseLang;const heldLang=new Promise(r=>releaseLang=r);
  const langcase=setup(async u=>u.pathname==='/catalog'?(await heldLang,ok(catalog())):ok(source(plan())));
  const beforeLang=draw(langcase.render,'week-language');await tick();const afterLang=draw(langcase.render,'week-language','uk');releaseLang();await Promise.all([beforeLang,afterLang]);await tick();
  report('language change during initial catalog load',{dishDisabled:document.querySelector('[data-focus="dish-0"]').disabled,addFormPresent:!!document.querySelector('.tm-add-form'),readAgainPresent:[...document.querySelectorAll('#app button')].some(b=>b.textContent==='Прочитати знову'),log:langcase.log});
  let releaseEarly;const earlyHeld=new Promise(r=>releaseEarly=r);
  const early=setup(async(u,init)=>{
   if(init.method==='POST')return ok({commit:B,blobSha:'blob-b',unchanged:false,warnings:[]});
   if(u.pathname==='/catalog'){
    const r=u.searchParams.get('revision')||A;if(r===A)await earlyHeld;
    return ok({...catalog(r),dishes:{soup:{name:{en:r===A?'Soup A':'Soup B'},components:[]}}});
   }
   return ok(source(plan()));
  });
  const earlyRender=draw(early.render,'week-early-save');await tick();set('13');button('Save plan').click();await tick();releaseEarly();await earlyRender;await tick();
  report('catalog after save before initial catalog completes',{dish:document.querySelector('[data-focus="dish-0"]').selectedOptions[0].textContent,source:document.querySelector('[data-phase]').textContent,log:early.log});
  const four=setup(u=>u.pathname==='/catalog'?ok(catalog()):ok(source(plan())));await draw(four.render,'week-invalid');set('13');set('0');set('13');
  report('correct invalid count back to prior valid draft',{count:document.querySelector('[data-focus="servings-0"]').value,saveDisabled:button('Save plan').disabled,errorPresent:document.querySelector('#app').textContent.includes('Enter a positive whole number'),phase:document.querySelector('[data-phase]').dataset.phase});
 }catch(e){report('probe error',{error:e.stack});}
};
</script></body></html>
