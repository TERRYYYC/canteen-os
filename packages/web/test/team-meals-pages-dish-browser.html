<!doctype html><html lang="zh"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dish editor · explicit mock</title>
<style>body{margin:0}#controls{padding:12px;background:#ffeac5;display:flex;gap:8px;flex-wrap:wrap}#controls button{min-height:44px}#app{max-width:760px;margin:auto}</style>
<div id="controls"><strong>模拟网络，仅内存数据 · no real write</strong><button data-lang="zh">中文</button><button data-lang="en">English</button><button data-lang="uk">Українська</button><button id="new">新建</button><button id="existing">原菜谱</button><button id="hold">下次延迟回应</button><button id="release">释放回应</button><button id="unknown">下次回应丢失</button><button id="conflict">下次冲突</button></div><div id="app"></div>
<script type="module">
import '../src/tokens.css'; import '../src/styles.css';
import {render} from '../src/pages/admin/dish-new.ts';
import {ApiError} from '../src/api/types.ts';
const A='a'.repeat(40),B='b'.repeat(40);let lang='zh',rest='soup',behavior='normal',release;
const dish={schemaVersion:'3',name:{zh:'配方未知份数的汤',en:'Soup with unknown recipe servings',uk:'Суп без відомої кількості порцій'},components:[{ingredientRef:'water',qty:{value:850,unit:'ml'}},{ingredientRef:'salt',confidence:{value:.8,source:'video'}}],steps:[{text:{zh:'煮开后加入盐',en:'Bring to boil and add salt',uk:'Доведіть до кипіння та додайте сіль'},clip:{videoUrl:'https://example.org/recipe',start:2,end:4}}],provenance:{source:'video',videoUrl:'https://example.org/recipe'},status:'draft'};
let current={content:dish,commit:A,blobSha:'blob-a'};const writes=[];
async function write(id,content,condition){writes.push(structuredClone({id,content,condition}));const next=behavior;behavior='normal';if(next==='conflict'){current={content:{...dish,name:{zh:'远端汤'}},commit:B,blobSha:'blob-b'};throw new ApiError(409,'conflict','');}current={content:structuredClone(content),commit:B,blobSha:'blob-b'};if(next==='unknown')throw new TypeError('response lost');if(next==='hold')await new Promise(resolve=>release=resolve);return{commit:B,blobSha:'blob-b',unchanged:false,warnings:[]};}
const api={mode:'mock',sessionKey:()=>0,getDish:async(id)=>id==='soup'?structuredClone(current):null,getCatalog:async()=>({commit:A,dishes:{soup:dish},ingredients:{water:{schemaVersion:'2',name:{zh:'水',en:'Water',uk:'Вода'},baseUnit:'ml',role:'main'},salt:{schemaVersion:'2',name:{zh:'盐',en:'Salt',uk:'Сіль'},baseUnit:'g',role:'seasoning'}},techniques:[],suppliers:[],translations:{machine:0,human:0,stale:0}}),saveDish:write,saveDishDraft:write};
async function paint(){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);await render(el,{lang,planId:null,rest,route:'admin',data:{},t:k=>k},rest,api);}
for(const b of document.querySelectorAll('[data-lang]'))b.onclick=()=>{lang=b.dataset.lang;paint();};
document.querySelector('#hold').onclick=()=>behavior='hold';document.querySelector('#release').onclick=()=>release?.();document.querySelector('#unknown').onclick=()=>behavior='unknown';document.querySelector('#conflict').onclick=()=>behavior='conflict';document.querySelector('#new').onclick=()=>{rest='new';paint();};document.querySelector('#existing').onclick=()=>{rest='soup';paint();};window.dishMockWrites=writes;paint();
</script><button id="run-review">Run dish review probes</button><pre id="review-result" aria-live="polite"></pre><script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {render} from '../src/pages/admin/dish-new.ts';import {getApi} from '../src/api/client.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30));const results=[];
const dish={schemaVersion:'3',name:{zh:'原来的汤',en:'Original soup'},status:'active'};
function setup(mode='mock'){const writes=[];const api={mode,sessionKey:()=>0,getDish:async id=>({content:structuredClone(dish),commit:A,blobSha:'blob-a'}),getCatalog:async()=>({commit:A,dishes:{soup:dish},ingredients:{},techniques:[],suppliers:[],translations:{}}),saveDish:async(id,body,condition)=>{writes.push({id,body,condition});return{commit:B,blobSha:'blob-b',unchanged:false,warnings:[]};}};api.saveDishDraft=api.saveDish;return{api,writes};}
async function draw(api,rest='soup',lang='en'){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,api);await tick();}
const findButton=label=>[...document.querySelectorAll('#app button')].find(x=>x.textContent===label);
const set=(sel,val)=>{const e=document.querySelector(sel);if(!e)throw new Error('missing '+sel);e.value=val;e.dispatchEvent(new Event('input',{bubbles:true}));};
const status=()=>document.querySelector('.adm-dish-edit-state')?.textContent;
function report(name,detail){const expected = name.startsWith('unresolved') ? detail.id==='new-soup' && /unknown/i.test(detail.after) : name.startsWith('photo dirty') ? detail.dirtyBefore && detail.dirtyAfter && detail.previewStillPresent : name.startsWith('upload ownership') ? detail.uploads===1 && detail.disabledBefore && detail.disabledAfter : name.startsWith('inline auxiliary') ? detail.writes===1 && detail.disabledAfter && detail.inputDisabled && detail.dirtyAfter && detail.savedRef==='review-ingredient' && !detail.inlineStillPresent : false; results.push({name,passed:!!expected,...detail});document.querySelector('#review-result').textContent=JSON.stringify(results,null,2);}
function unloadWarning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
async function photo(){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const transfer=new DataTransfer();transfer.items.add(new File([blob],'review.png',{type:'image/png'}));const input=document.querySelector('#adm-dish-photo-pick');input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));for(let i=0;i<20&&!document.querySelector('.adm-dish-preview img');i++)await tick();if(!document.querySelector('.adm-dish-preview img'))throw new Error('photo not ready');}
document.querySelector('#run-review').onclick=async()=>{try{
 results.length=0;
 const one=setup();const normal=one.api.saveDish;one.api.saveDishDraft=async(id,...args)=>{if(id==='new-soup')throw new TypeError('simulated lost reply');return normal(id,...args);};
 await draw(one.api,'new');set('#adm-dish-name-zh','尚未核实的新汤');set('#adm-dish-id','new-soup');findButton('Save draft').click();await tick();const before=status();await draw(one.api,'soup');findButton('Save draft').click();await tick();findButton('Add another').click();await tick();await draw(one.api,'new');report('unresolved new dish after add-another from saved existing dish',{before,after:status(),id:document.querySelector('#adm-dish-id').value,draftName:document.querySelector('#adm-dish-name-zh').value});
 const two=setup('real');await draw(two.api);await photo();const dirtyBefore=unloadWarning();await draw(two.api,'soup','uk');report('photo dirty state across language',{dirtyBefore,dirtyAfter:unloadWarning(),previewStillPresent:!!document.querySelector('.adm-dish-preview img'),status:status()});
 const aux=getApi();const previous=aux.uploadImage;let uploads=0;const releases=[];aux.uploadImage=async()=>{uploads++;await new Promise(r=>releases.push(r));return {src:'data/dishes/soup/images/review.png',license:'own'};};
 document.querySelector('.adm-dish-save-draft').click();await tick();const disabledBefore=document.querySelector('.adm-dish-save-draft').disabled;await draw(two.api,'soup','en');const disabledAfter=document.querySelector('.adm-dish-save-draft').disabled;document.querySelector('.adm-dish-save-draft').click();await tick();report('upload ownership across language',{uploads,disabledBefore,disabledAfter,status:status()});for(const release of releases)release();await tick();aux.uploadImage=previous;
 const three=setup('real');await draw(three.api);findButton('Add an ingredient').click();document.querySelector('.adm-dish-result-new').click();set('#adm-dish-c1-ing-name-zh','内联原始食材');set('#adm-dish-c1-ing-id','review-ingredient');await draw(three.api,'soup','uk');const dirtyAfter=unloadWarning();
 const oldSave=aux.saveIngredient;let ingredientWrites=0,finishIngredient;aux.saveIngredient=async()=>{ingredientWrites++;await new Promise(r=>finishIngredient=r);return {commit:B,blobSha:'ingredient-blob-b',unchanged:false,warnings:[]};};
 findButton('Зберегти інгредієнт').click();await tick();await draw(three.api,'soup','en');const inlineSave=findButton('Save this ingredient'),inputDisabled=document.querySelector('#adm-dish-c1-ing-name-zh').disabled,inlineDisabled=inlineSave.disabled;inlineSave.click();await tick();finishIngredient();await tick();report('inline auxiliary ownership across language',{writes:ingredientWrites,disabledAfter:inlineDisabled,inputDisabled,dirtyAfter,inlineStillPresent:!!document.querySelector('.adm-dish-inline'),savedRef:document.querySelector('.adm-dish-chosen code')?.textContent});aux.saveIngredient=oldSave;
}catch(e){report('probe error',{message:e.stack});}};
</script></html>
