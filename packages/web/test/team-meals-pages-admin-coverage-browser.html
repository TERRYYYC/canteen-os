<!doctype html><html lang="en"><meta charset="utf-8"><title>Admin navigation coverage · local fixture</title><p>Local readonly navigation with a synthetic login string only</p><button id="run">Run Admin navigation checks</button><pre id="results">Not run</pre><div id="app"></div><script type="module">
import {render} from '../src/pages/admin.ts';import {clearToken,consumeTokenFromRest} from '../src/admin/token.ts';import {createPageReloadCoverage,inspectReloadSafety} from '../src/view-models/reload-safety.ts';
const coverage=createPageReloadCoverage(),app=document.querySelector('#app'),checks=[],out=document.querySelector('#results');
async function mount(rest,detach=false){const el=document.createElement('section');app.replaceChildren(el);const p=render(el,{lang:'en',planId:'week-38',rest,setReloadCoverage:coverage.beginRender('admin',rest)});if(detach)el.remove();await p;return el;}
function check(name,pass){checks.push({name,pass:!!pass});out.textContent=JSON.stringify({summary:`${checks.filter(x=>x.pass).length}/${checks.length}`,checks,snapshot:inspectReloadSafety()},null,2);if(!pass)throw Error(name);}
document.querySelector('#run').onclick=async()=>{try{clearToken();let el=await mount('');check('locked navigation completes as readonly',inspectReloadSafety().reason==='clear'&&el.textContent.length>0);consumeTokenFromRest('t/'+ 'a'.repeat(43));el=await mount('missing-screen');check('not-found navigation completes as readonly',inspectReloadSafety().reason==='clear'&&el.textContent.includes('No such screen'));await mount('dish/soup',true);check('abandoned dynamic screen import finishes only original coverage',inspectReloadSafety().reason==='clear');clearToken();check('navigation evidence does not expose synthetic login string',!JSON.stringify(inspectReloadSafety()).includes('a'.repeat(43)));}catch(error){out.textContent+='\nFAIL '+error.stack;}finally{clearToken();}};
</script></html>
