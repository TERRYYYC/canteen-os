<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publish update protection · local fixture</title>
<style>aside{padding:16px;background:#ffeac5}button{min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{max-width:1050px;margin:auto}</style><aside>Actual Publish and reload registry · synthetic transport only <button id="run">Run Publish update protection checks</button></aside><pre id="results">Not run</pre><main id="app"></main>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';import '../src/pages/admin/publish.css';
import {render,createTeamMealsApi,HttpAdminApi,changeAuth,inspectReloadSafety,createPageReloadCoverage,publishSourceHash} from './team-meals-pages-publish-browser.generated.mjs';
const A='a'.repeat(40),B='b'.repeat(40),C='c'.repeat(40),app=document.querySelector('#app'),output=document.querySelector('#results'),checks=[],calls=[],coverage=createPageReloadCoverage();let identity=1,heldChanges=null,heldRollback=null,holdChanges=true,holdRollback=false;
const changes=()=>({onlineCommit:A,lastPublishedAt:'2026-09-10T00:00:00Z',unpublished:[{sha:B,at:'2026-09-11T00:00:00Z',role:'chef',endpoint:'POST /plan/week-38',subject:'Changed meal',files:['data/menu-plans/week-38.json']}],publishes:[{sha:A,at:'2026-09-10T00:00:00Z',runId:10,isOnline:true}]});
const progress=()=>({runId:11,status:'in_progress',steps:[],failedStep:null,failureReason:null,unmappedSteps:[],runCompleted:true,runConclusion:'cancelled'});
const opts={token:()=>'explicit-fixture',identity:()=>identity,fetch:async(url,init)=>{const path=new URL(url).pathname;calls.push({path,method:init.method});if(path==='/changes'&&holdChanges){holdChanges=false;return new Promise(resolve=>heldChanges=resolve);}if(path.startsWith('/rollback')&&holdRollback)return new Promise(resolve=>heldRollback=resolve);return Response.json({ok:true,...(path==='/changes'?changes():path==='/publish'?{runId:11,mode:'dispatch'}:path.startsWith('/publish/')?progress():{commit:C,restoredFrom:A,changedFiles:2})});}};
const team=createTeamMealsApi('https://publish-aux.invalid',opts),legacy=new HttpAdminApi('https://publish-aux.invalid',opts);globalThis.__publishBrowser={team,legacy};
const pause=()=>new Promise(resolve=>setTimeout(resolve,40));async function mount(lang='en'){history.replaceState(null,'','#/admin/publish');const el=document.createElement('section');app.replaceChildren(el);render(el,{lang,planId:'week-38',rest:'publish',setReloadCoverage:coverage.beginRender('admin','publish')},'');await pause();return el;}
function auth(){identity++;changeAuth();}function check(name,pass){checks.push({name,pass:!!pass});output.textContent=JSON.stringify({summary:`${checks.filter(x=>x.pass).length}/${checks.length}`,sourceHash:publishSourceHash,checks,calls,snapshot:inspectReloadSafety()},null,2);if(!pass)throw Error(name);}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 await mount();check('initial changes read registers before awaiting',inspectReloadSafety().reason==='saving');auth();await mount('uk');check('unfinished old initialization remains anonymous and protected',inspectReloadSafety().reason==='unknown');heldChanges(Response.json({ok:true,...changes()}));await pause();check('actual old read finally releases only original coverage',inspectReloadSafety().reason==='clear');
 let el=await mount();el.querySelector('.adm-pub-publish').click();await pause();check('strict matching terminal clears registered write',inspectReloadSafety().reason==='clear'&&!el.querySelector('.adm-pub-publish').disabled);check('cancelled build does not claim successful publication',el.textContent.includes('Build was cancelled')&&!el.textContent.includes('Live · everyone'));
 let resolveA,resolveB,reads=0;legacy.getPublish=()=>new Promise(resolve=>{if(++reads===1)resolveA=resolve;else resolveB=resolve;});el.querySelector('.adm-pub-publish').click();await pause();auth();el=await mount();el.querySelector('.adm-pub-publish').click();await pause();auth();await mount('uk');check('two original in-flight runs remain protected after auth',inspectReloadSafety().reason==='unknown');resolveA(progress());await pause();check('first original terminal cannot settle second original write',inspectReloadSafety().reason==='unknown'&&inspectReloadSafety().records.filter(r=>r.kind==='unknown'&&r.phase==='unknown').length===1);resolveB(progress());await pause();check('second exact terminal retires only remaining old owner',inspectReloadSafety().reason==='clear');
 holdRollback=true;el=await mount();el.querySelector('.adm-pub-rollback').click();el.querySelector('.adm-pub-rollback-go').click();await pause();auth();el=await mount('uk');heldRollback(Response.json({ok:true,commit:C,restoredFrom:A,changedFiles:2}));await pause();check('real HttpAdminApi hidden old rollback ACK stays unknown',inspectReloadSafety().reason==='unknown'&&inspectReloadSafety().records.some(r=>r.kind==='unknown'&&r.id==='previous-session-operation'));check('old rollback cannot fill current-language success UI',!el.textContent.includes('Повернуто до'));check('fixture never guesses latest-run ownership',!calls.some(c=>c.path.includes('/latest')));
}catch(error){output.textContent+='\nFAIL '+error.stack;}};
</script></html>
