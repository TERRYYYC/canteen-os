<aside><strong>D Plan raw owner · Explicit local fixture</strong><label>Language <select id="lang"><option value="zh">中文</option><option value="en" selected>English</option><option value="uk">Українська</option></select></label><label>Plan <select id="plan"><option>week-a</option><option>week-b</option></select></label><label>Save response <select id="scenario"><option>success</option><option>hold</option><option>lost</option></select></label><button id="reset">Reset fixture</button><button id="away">Leave page</button><button id="back">Return</button><button id="release">Release held save</button><button id="inspect">Inspect raw metadata</button><button id="run">Run raw owner checks</button><p>Actual Plan renderer and C1 with mocked fetch. No real plan writes, source history or reload coverage are proved. C1 owns plan JSON; page auxiliary metadata covers raw inputs only.</p></aside>

<script type="module">
import '../src/tokens.css';import '../src/styles.css';import {createPlanRenderer} from '../src/pages/admin/plan.ts';import {createTeamMealsApi} from '../src/api/team-meals.ts';
const $=s=>document.querySelector(s),A='a'.repeat(40),B='b'.repeat(40),raw='2.0000000000000001',calls=[],checks=[];let api,renderer,saved,held=[];
const seed=()=>({schemaVersion:'3',margin:1.13,meals:[{date:'2026-09-14',mealType:'lunch',dishRef:'soup',plannedServings:8},{date:'2026-09-15',mealType:'dinner',dishRef:'stew',plannedServings:12,serviceWindow:'18:00-19:00'},{date:'2026-09-16',mealType:'lunch',dishRef:'soup'}]});
function report(){ $('#ledger').textContent=JSON.stringify({fixture:'Explicit synthetic records; actual page/C1; no shared coverage registration',owners:['week-a','week-b'].map(id=>renderer?.readAuxiliary?.(id)??null),checks,calls},null,2); }
function connect(){api?.dispose();saved=new Map(['week-a','week-b'].map(id=>[id,{content:seed(),commit:A,blobSha:'before'}]));api=createTeamMealsApi('https://plan-raw-fixture.invalid',{mode:'mock',token:()=>'explicit-local-fixture',identity:()=>1,fetch:async(url,init)=>{
 const u=new URL(url);if(u.origin!=='https://plan-raw-fixture.invalid')throw new Error('Unexpected origin');const path=u.pathname;
 if(init.method==='GET'){calls.push({method:'GET',path,revision:u.searchParams.get('revision')});if(path==='/catalog')return Response.json({commit:u.searchParams.get('revision')??A,dishes:{soup:{schemaVersion:'3',name:{zh:'汤',en:'Soup',uk:'Суп'},components:[]},stew:{schemaVersion:'3',name:{zh:'炖菜',en:'Stew',uk:'Рагу'},components:[]}},ingredients:{},techniques:[],suppliers:[],translations:{machine:0,human:0,stale:0}});return Response.json(saved.get(path.split('/').at(-1)));}
 const body=JSON.parse(init.body),id=path.split('/').at(-1);calls.push({method:'POST',path,body,ifMatch:new Headers(init.headers).get('If-Match')});report();saved.set(id,{content:structuredClone(body),commit:B,blobSha:'after'});const scenario=$('#scenario').value;if(scenario==='hold')await new Promise(resolve=>held.push(resolve));if(scenario==='lost')throw new Error('Explicit lost acknowledgement');return Response.json({ok:true,commit:B,blobSha:'after',unchanged:false,warnings:[]});
 }});renderer=createPlanRenderer(api);}
async function paint(){document.documentElement.lang=$('#lang').value;const el=document.createElement('section');$('#app').replaceChildren(el);await renderer(el,{lang:$('#lang').value,planId:$('#plan').value,rest:$('#plan').value,route:'admin',data:{},t:k=>k},$('#plan').value);report();}
async function reset(){connect();await paint();}function leave(){$('#app').textContent='Fixture page detached; pending raw inputs remain owned by their plan.';report();}
$('#lang').onchange=paint;$('#plan').onchange=paint;$('#reset').onclick=reset;$('#away').onclick=leave;$('#back').onclick=paint;$('#inspect').onclick=report;$('#release').onclick=()=>{held.splice(0).forEach(fn=>fn());};
const pause=()=>new Promise(r=>setTimeout(r,25)),field=key=>$(`[data-focus="${key}"]`),save=()=>$('.tm-actions button');
function input(key,value,type='input'){const el=field(key);el.value=value;el.dispatchEvent(new Event(type,{bubbles:true}));}
const check=(name,pass)=>{checks.push({name,pass:!!pass});report();if(!pass)throw new Error(name);};
async function fresh(){$('#plan').value='week-a';$('#lang').value='en';$('#scenario').value='success';await reset();}
$('#run').onclick=async()=>{checks.length=0;calls.length=0;$('#run').disabled=true;try{
 await fresh();input('servings-1',raw);$('[data-meal-index="0"] button').click();check('remove earlier row preserves exact original row raw value and blocks save',field('servings-0').value===raw&&field('servings-0').getAttribute('aria-invalid')==='true'&&save().disabled);$('#lang').value='uk';await paint();check('language repaint retains remapped invalid raw',field('servings-0').value===raw&&save().disabled);
 const original=renderer.readAuxiliary('week-a');$('#plan').value='week-b';await paint();check('another plan does not consume original raw owner',renderer.readAuxiliary('week-a').dirty&&!renderer.readAuxiliary('week-b').dirty);$('#plan').value='week-a';await paint();check('return keeps original identity and generation',JSON.stringify(renderer.readAuxiliary('week-a'))===JSON.stringify(original)&&field('servings-0').value===raw);
 await fresh();const clean=renderer.readAuxiliary('week-a');input('filter-date','2026-09-16','change');input('range','day','change');check('read-only range/date filters do not mark raw dirty',JSON.stringify(renderer.readAuxiliary('week-a'))===JSON.stringify(clean));input('range','all','change');input('add-date','2026-10-03');input('add-meal','dinner','change');input('add-dish','stew','change');$('#lang').value='uk';await paint();check('Add choices retain date meal and dish across language',field('add-date').value==='2026-10-03'&&field('add-meal').value==='dinner'&&field('add-dish').value==='stew'&&renderer.readAuxiliary('week-a').dirty);check('unapplied choices do not present the page as unchanged',!$('#app').textContent.includes('Loaded; unchanged')&&!$('#app').textContent.includes('Завантажено; без змін'));$('#plan').value='week-b';await paint();$('#plan').value='week-a';await paint();check('unapplied Add survives cross-plan return',field('add-date').value==='2026-10-03'&&renderer.readAuxiliary('week-a').dirty);
 input('add-date','');$('.tm-add-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));check('failed incomplete Add does not consume pending',renderer.readAuxiliary('week-a').dirty&&document.querySelectorAll('[data-meal-index]').length===3);input('add-date','2026-10-03');$('.tm-add-form').requestSubmit();check('successful Add consumes auxiliary pending and appends exactly one C1 row',!renderer.readAuxiliary('week-a').dirty&&document.querySelectorAll('[data-meal-index]').length===4);save().click();await pause();check('Save serializes full plan only through C1',calls.filter(x=>x.method==='POST').at(-1)?.body.meals.length===4&&calls.filter(x=>x.method==='POST').at(-1)?.ifMatch==='before');
 await fresh();input('servings-0','9');input('add-date','2026-10-03');input('add-dish','stew','change');$('#scenario').value='lost';save().click();await pause();leave();await paint();check('unknown JSON save does not consume unapplied Add',!!$('[data-phase="outcome-unknown"]')&&renderer.readAuxiliary('week-a').dirty&&field('add-date').value==='2026-10-03'&&field('add-dish').value==='stew');
 $('#result').textContent=`PASS ${checks.length}/${checks.length} · actual page + C1, explicit local fixture only`;
 }catch(e){$('#result').textContent='FAIL · '+e.message;}finally{$('#run').disabled=false;report();}};
await reset();
</script></html>
