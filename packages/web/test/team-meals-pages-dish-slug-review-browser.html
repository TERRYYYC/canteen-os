<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Independent Dish pending siblings</title><p>Explicit local mock only · no external writes</p><button id="run-review">Run pending task probes</button><pre id="review-result"></pre><div id="app"></div><script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {ApiError} from '../src/api/types.ts';
import {render} from '../src/pages/admin/dish-new.ts';import {getApi} from '../src/api/client.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30));const results=[];
const dish={schemaVersion:'3',name:{zh:'原来的汤',en:'Original soup'},status:'active'};
function setup(mode='mock'){const writes=[];const api={mode,sessionKey:()=>0,peekSessionKey:()=>0,getDish:async id=>({content:structuredClone(dish),commit:A,blobSha:'blob-a'}),getCatalog:async()=>({commit:A,dishes:{soup:dish},ingredients:{},techniques:[],suppliers:[],translations:{}}),saveDish:async(id,body,condition)=>{writes.push({id,body,condition});return{commit:B,blobSha:'blob-b',unchanged:false,warnings:[]};}};api.saveDishDraft=api.saveDish;return{api,writes};}
async function draw(api,rest='soup',lang='en'){location.hash='#/admin/dish/'+rest;const el=document.createElement('section');document.querySelector('#app').replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,api);await tick();}
const findButton=label=>[...document.querySelectorAll('#app button')].find(x=>x.textContent===label);
const set=(sel,val)=>{const e=document.querySelector(sel);if(!e)throw new Error('missing '+sel);e.value=val;e.dispatchEvent(new Event('input',{bubbles:true}));};
const status=()=>document.querySelector('.adm-dish-edit-state')?.textContent;
function unloadWarning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
async function photo(inputSelector='#adm-dish-photo-pick',previewSelector='.adm-dish-preview img'){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const transfer=new DataTransfer();transfer.items.add(new File([blob],'review.png',{type:'image/png'}));const input=document.querySelector(inputSelector);input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));for(let i=0;i<20&&!document.querySelector(previewSelector);i++)await tick();if(!document.querySelector(previewSelector))throw new Error('photo not ready');}

function report(name,passed,detail){results.push({name,passed,...detail});document.querySelector('#review-result').textContent=JSON.stringify(results,null,2);}
function errors(){return [...document.querySelectorAll('#app .adm-field-error:not([hidden]),#app .adm-form-errors')].map(x=>x.textContent);}
async function inline(api){await draw(api);findButton('Add an ingredient').click();document.querySelector('.adm-dish-result-new').click();}

function holdDecode(){const Original=window.Image;const releases=[];window.Image=class extends Original{set onload(fn){super.onload=event=>releases.push(()=>fn.call(this,event));}get onload(){return super.onload;}};return{releases,finish(){window.Image=Original;releases.splice(0).forEach(fn=>fn());}};}
async function selectPhoto(selector){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'pending.png',{type:'image/png'}));const input=document.querySelector(selector);input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));}
async function until(fn){for(let i=0;i<100;i++){if(fn())return;await tick();}throw new Error('condition not reached');}
async function caseOf(name,fn){try{await fn();}catch(error){report(name,false,{error:String(error.stack)});}}
document.querySelector('#run-review').onclick=async()=>{results.length=0;const aux=getApi(),oldTranslate=aux.translate;
 await caseOf('new slug language',async()=>{const s=setup('real');await draw(s.api,'new');set('#adm-dish-name-zh','新增的汤');let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();await draw(s.api,'new','uk');release({en:'Hidden Target Soup',uk:'Новий суп'});await tick();const visibleId=document.querySelector('#adm-dish-id').value;document.querySelector('.adm-dish-save-draft').click();await tick();report('current new-dish slug matches the late translation and actual save target',visibleId==='hidden-target-soup'&&s.writes[0]?.id===visibleId,{visibleId,visibleEnglish:document.querySelector('#adm-dish-name-en').value,writes:s.writes});});
 await caseOf('new slug return',async()=>{const s=setup('real');await draw(s.api,'new');set('#adm-dish-name-zh','返回新菜');let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();await draw(s.api,'soup');await draw(s.api,'new');release({en:'Returned Dish',uk:'Страва'});await tick();const visibleId=document.querySelector('#adm-dish-id').value;report('returning during translation updates the current slug field',visibleId==='returned-dish',{visibleId,english:document.querySelector('#adm-dish-name-en').value});});
 await caseOf('manual new slug',async()=>{const s=setup('real');await draw(s.api,'new');set('#adm-dish-name-zh','自定义');set('#adm-dish-id','user-slug');let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();await draw(s.api,'new','uk');release({en:'Machine Slug',uk:'Страва'});await tick();report('preset explicit slug remains original after translation',document.querySelector('#adm-dish-id').value==='user-slug',{visibleId:document.querySelector('#adm-dish-id').value});});

 await caseOf('new slug duplicate',async()=>{const s=setup('real');await draw(s.api,'new');set('#adm-dish-name-zh','不是原汤');let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();await draw(s.api,'new','uk');release({en:'Soup',uk:'Суп'});await tick();const visibleId=document.querySelector('#adm-dish-id').value,dupVisible=!document.querySelector('.adm-dish-dup').hidden;document.querySelector('.adm-dish-save-draft').click();await tick();report('late generated duplicate slug is visible and blocks local duplicate save',visibleId==='soup'&&dupVisible&&s.writes.length===0,{visibleId,dupVisible,writes:s.writes});});
 await caseOf('new slug same view',async()=>{const s=setup('real');await draw(s.api,'new');set('#adm-dish-name-zh','同页');let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();release({en:'Same View Soup',uk:'Суп'});await tick();report('same-view translation keeps generated slug visible',document.querySelector('#adm-dish-id').value==='same-view-soup',{visibleId:document.querySelector('#adm-dish-id').value});});
 await caseOf('auth translation',async()=>{const s=setup('real');let auth=0;s.api.sessionKey=()=>auth;s.api.peekSessionKey=()=>auth;await draw(s.api);let release;aux.translate=async()=>new Promise(r=>release=r);findButton('Translate').click();await tick();auth++;await draw(s.api,'soup','uk');release({en:'Private Previous Account',uk:'Старий'});await tick();report('old-auth translation does not mutate replacement view or keep it busy',document.querySelector('#adm-dish-name-en').value==='Original soup'&&!document.querySelector('.adm-dish-save-draft').disabled,{value:document.querySelector('#adm-dish-name-en').value});});
 aux.translate=oldTranslate;
};
</script>
