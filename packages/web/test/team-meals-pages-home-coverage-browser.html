<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home read coverage · local fixture</title><style>aside{padding:16px;background:#ffeac5}button{min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{max-width:1050px;margin:auto}</style><aside>Actual Home and reload registry · synthetic reads only <button id="run">Run Home coverage checks</button></aside><pre id="results">Not run</pre><main id="app"></main>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';import '../src/pages/admin/home.css';
import {render,createTeamMealsApi,HttpAdminApi,changeAuth,setLang,inspectReloadSafety,createPageReloadCoverage,homeSourceHash} from './team-meals-pages-home-browser.generated.mjs';
const A='a'.repeat(40),checks=[],waiting=[],calls=[],app=document.querySelector('#app'),out=document.querySelector('#results'),coverage=createPageReloadCoverage();let identity=1,hold=true;
const opts={token:()=>'explicit-fixture',identity:()=>identity,fetch:async(url,init)=>{const path=new URL(url).pathname;calls.push({method:init.method,path});if(init.method!=='GET')throw Error('Writes forbidden');if(hold)await new Promise(resolve=>waiting.push(resolve));return Response.json(path==='/changes'?{ok:true,unpublished:[],publishes:[],lastPublishedAt:null,onlineCommit:A}:path==='/catalog'?{commit:A,dishes:{},ingredients:{},techniques:[],suppliers:[],translations:{machine:0,human:0,stale:0}}:{content:{schemaVersion:'3',meals:[]},commit:A,blobSha:'before'});}};
const team=createTeamMealsApi('https://home-coverage.invalid',opts),legacy=new HttpAdminApi('https://home-coverage.invalid',opts);globalThis.__homeBrowser={team,legacy};
const pause=()=>new Promise(resolve=>setTimeout(resolve,40));async function mount(lang='en'){setLang(lang);const el=document.createElement('section');app.replaceChildren(el);render(el,{lang,planId:'week-38',rest:'',setReloadCoverage:coverage.beginRender('admin','')},'');await pause();return el;}
function check(name,pass){checks.push({name,pass:!!pass});out.textContent=JSON.stringify({summary:`${checks.filter(x=>x.pass).length}/${checks.length}`,sourceHash:homeSourceHash,checks,calls,snapshot:inspectReloadSafety()},null,2);if(!pass)throw Error(name);}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{
 await mount();check('three initial reads are protected before any response',inspectReloadSafety().reason==='saving'&&waiting.length===3);await mount('uk');check('language reuses three existing reads and registered coverage',inspectReloadSafety().reason==='saving'&&waiting.length===3);waiting[0]();waiting[1]();await pause();check('two results cannot release the third read',inspectReloadSafety().reason==='saving');waiting[2]();await pause();check('all reads finishing release the actual home coverage',inspectReloadSafety().reason==='clear');
 identity++;changeAuth();await mount('en');check('new identity starts its own reads',inspectReloadSafety().reason==='saving'&&waiting.length===6);identity++;changeAuth();await mount('uk');check('old pending reads become anonymous protected state',inspectReloadSafety().reason==='unknown'&&waiting.length===9);waiting.slice(3,6).forEach(resolve=>resolve());await pause();check('old initialization completion leaves new reads protected',inspectReloadSafety().reason==='saving');waiting.slice(6,9).forEach(resolve=>resolve());await pause();check('new initialization completion releases current coverage',inspectReloadSafety().reason==='clear');check('home never posts or fabricates meal counts',calls.every(c=>c.method==='GET')&&app.textContent.includes('0'));
}catch(error){out.textContent+='\nFAIL '+error.stack;}};
</script></html>
