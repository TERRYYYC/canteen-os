<!doctype html><html lang="en"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingredient lifecycle · explicit local simulation</title>
<style>body{margin:0}#controls{padding:12px;background:#ffeac5}#controls button{min-height:44px;margin:4px}#app{max-width:760px;margin:auto}#results{white-space:pre-wrap;margin:16px}</style>
<div id="controls"><strong>Local simulated transport · no real repository writes</strong><button id="run">Run ingredient browser probes</button></div><div id="app"></div><pre id="results" aria-live="polite"></pre>
<script type="module">
import '../src/tokens.css';import '../src/styles.css';
import {render} from '../src/pages/admin/ingredient-new.ts';
import {getApi} from '../src/api/client.ts';import {createTeamMealsApi} from '../src/api/team-meals.ts';import {clearToken} from '../src/admin/token.ts';
const A='a'.repeat(40),B='b'.repeat(40),tick=()=>new Promise(r=>setTimeout(r,30)),results=[];
const app=document.querySelector('#app'),out=document.querySelector('#results');
const pending=()=>{let resolve;const promise=new Promise(r=>resolve=r);return{promise,resolve};};
const assert=(value,message)=>{if(!value)throw new Error(message);};
const set=(selector,value)=>{const field=app.querySelector(selector);assert(field,selector);field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));};
const submit=()=>app.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
const button=label=>[...app.querySelectorAll('button')].find(n=>n.textContent===label);
function warning(){const event=new Event('beforeunload',{cancelable:true});window.dispatchEvent(event);return event.defaultPrevented;}
function setup(mode='real'){
 let identity=0;let current={content:{schemaVersion:'2',name:{zh:'盐',en:'Salt',uk:'Сіль'},baseUnit:'g',role:'seasoning',trackStock:false},commit:A,blobSha:'salt-a'};
 const reads=[],writes=[],uploads=[],legacyReads=[];const legacy=getApi();
 legacy.getCatalog=async()=>{legacyReads.push('catalog');throw new Error('legacy catalog must not run');};legacy.getIngredient=async()=>{legacyReads.push('ingredient');throw new Error('legacy ingredient read must not run');};legacy.translate=async()=>({});
 const api=createTeamMealsApi(mode==='unconfigured'?'':'https://ingredient.local.invalid',{mode:mode==='mock'?'mock':'real',identity:()=>identity,token:()=> 'explicit-local-fixture',fetch:async url=>{const path=new URL(url).pathname;reads.push(path);const body=path==='/catalog'?{commit:A,dishes:{soup:{schemaVersion:'3',name:{zh:'汤'}}},ingredients:{salt:current.content},suppliers:['Mixed v3 supplier'],techniques:[],translations:{machine:0,human:0,stale:0}}:structuredClone(current);return new Response(JSON.stringify(body));}});
 legacy.saveIngredient=async(id,body,condition)=>{writes.push(structuredClone({id,body,condition}));current={content:structuredClone(body),commit:B,blobSha:'salt-b'};return{commit:B,blobSha:'salt-b',unchanged:false,warnings:[]};};
 legacy.uploadImage=async(...args)=>{uploads.push(args);return{src:'data/ingredients/salt/images/local.png',license:'own'};};
 return{api,legacy,reads,writes,uploads,legacyReads,bump(){identity++;},setCurrent(value){current=value;}};
}
async function draw(s,rest='salt',lang='en'){location.hash='#/admin/ingredient/'+rest;const el=document.createElement('section');app.replaceChildren(el);await render(el,{lang,route:'admin',rest,planId:null,data:{},t:k=>k},rest,s.api);await tick();return el;}
async function leave(){location.hash='#/admin';app.replaceChildren(document.createTextNode('Other page'));await tick();}
async function photo(){const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;canvas.getContext('2d').fillRect(0,0,2,2);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const dt=new DataTransfer();dt.items.add(new File([blob],'local.png',{type:'image/png'}));const input=app.querySelector('#adm-ing-photo-pick');input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));const busyImmediately=app.querySelector('.adm-ing-save').disabled;for(let n=0;n<20&&!app.querySelector('.adm-ing-preview');n++)await tick();assert(app.querySelector('.adm-ing-preview'),'photo decode not ready');return busyImmediately;}
async function run(name,fn){try{const detail=await fn();results.push({name,passed:true,...detail});}catch(error){results.push({name,passed:false,error:String(error.stack??error)});}out.textContent=JSON.stringify(results,null,2);}
document.querySelector('#run').onclick=async()=>{
 results.length=0;
 await run('C1 mixed v2/v3 catalog populates supplier and duplicate checks',async()=>{const s=setup();await draw(s,'new');assert([...app.querySelectorAll('option')].some(n=>n.value==='Mixed v3 supplier'),'supplier missing');set('#adm-ing-name-zh','盐');set('#adm-ing-id','salt');assert(!app.querySelector('.adm-ing-dup').hidden,'duplicate missing');submit();await tick();assert(s.writes.length===0,'duplicate submitted');assert(s.legacyReads.length===0,'legacy reader invoked');return{legacyReads:s.legacyReads,writes:s.writes.length};});
 await run('unconfigured and explicit simulation cannot submit',async()=>{const s=setup('unconfigured');await draw(s);assert(!app.querySelector('form'),'unconfigured form exists');assert(app.textContent.includes('Not connected'),'missing notice');assert(!s.reads.length&&!s.legacyReads.length,'unconfigured read');const m=setup('mock');await draw(m);assert(app.textContent.includes('Simulation'),'simulation label absent');submit();await tick();assert(m.writes.length===0,'simulation write');return{unconfiguredReads:s.reads.length,simulationWrites:m.writes.length};});
 await run('raw invalid numeric buffer survives route and language',async()=>{const s=setup();await draw(s);set('#adm-ing-packSize','12,');await leave();assert(warning(),'offscreen dirty unprotected');await draw(s,'salt','uk');assert(app.querySelector('#adm-ing-packSize').value==='12,','raw changed');return{raw:app.querySelector('#adm-ing-packSize').value,warning:warning()};});
 await run('photo and upload ownership survives language and leaving; only snapshot is saved',async()=>{const s=setup();await draw(s);const photoBusy=await photo();assert(photoBusy,'photo decode not tracked');const wait=pending();let uploads=0;s.legacy.uploadImage=async()=>{uploads++;await wait.promise;return{src:'data/ingredients/salt/images/local.png',license:'own'};};submit();await tick();await draw(s,'salt','uk');assert(app.querySelector('.adm-ing-save').disabled,'upload unlocked');submit();assert(uploads===1,'duplicate upload');set('#adm-ing-name-zh','等待时的新名字');await leave();wait.resolve();await tick();await draw(s);assert(s.writes.length===1,'unexpected save count');assert(s.writes[0].body.name.zh==='盐','submitted later raw name');assert(app.querySelector('#adm-ing-name-zh').value==='等待时的新名字','later name lost');assert(warning(),'later raw name marked clean');submit();await tick();assert(uploads===1&&s.writes[1].condition.ifMatch==='salt-b','duplicate upload or wrong baseline');return{photoBusy,uploads,writes:s.writes.length,savedSnapshot:s.writes[0].body.name.zh,laterSaved:s.writes[1].body.name.zh,condition:s.writes[1].condition};});
 await run('save unknown survives route; read-only verification keeps later raw input',async()=>{const s=setup();const save=s.legacy.saveIngredient;s.legacy.saveIngredient=async(...args)=>{await save(...args);throw new TypeError('local lost response');};await draw(s);set('#adm-ing-name-zh','提交名字');submit();await tick();await leave();await draw(s);assert(app.textContent.includes('outcome unknown'),'unknown disappeared');assert(app.querySelector('.adm-ing-save').disabled,'unknown unlocked');set('#adm-ing-name-zh','核实期间的新名字');button('Verify save outcome').click();await tick();assert(s.writes.length===1,'verify resent');assert(!app.querySelector('.adm-ing-save').disabled,'verified still blocked');assert(app.querySelector('#adm-ing-name-zh').value==='核实期间的新名字','later input lost');return{writes:s.writes.length,sourceReads:s.reads.filter(x=>x.startsWith('/source/ingredient/')).length,raw:app.querySelector('#adm-ing-name-zh').value};});
 await run('upload unknown remains blocked across view rebind',async()=>{const s=setup();await draw(s);await photo();let uploads=0;s.legacy.uploadImage=async()=>{uploads++;throw new TypeError('local upload response lost');};submit();await tick();await leave();await draw(s);submit();await tick();assert(uploads===1,'retried unknown upload');assert(app.querySelector('.adm-ing-save').disabled,'unknown upload unlocked');assert(app.textContent.includes('Photo upload outcome unknown'),'missing explanation');return{uploads,preservedPhoto:!!app.querySelector('.adm-ing-preview'),phase:app.querySelector('.adm-ing-owner-state').dataset.phase};});
 await run('late translation after language switch cannot replace newer user names',async()=>{const s=setup(),wait=pending();let calls=0;s.legacy.translate=async()=>{calls++;return wait.promise;};await draw(s);button('Translate').click();await draw(s,'salt','uk');assert(app.querySelector('.adm-ing-save').disabled,'translation not busy');set('#adm-ing-name-en','User English');wait.resolve({en:'Late machine name',uk:'Пізня назва'});await tick();assert(app.querySelector('#adm-ing-name-en').value==='User English','late translation overwrote raw');assert(!app.querySelector('.adm-ing-save').disabled,'busy leaked');return{calls,raw:app.querySelector('#adm-ing-name-en').value};});
 await run('auth replacement prevents an old upload from saving under the new session',async()=>{const s=setup(),wait=pending();await draw(s);await photo();s.legacy.uploadImage=async()=>{await wait.promise;return{src:'data/ingredients/salt/images/local.png',license:'own'};};submit();await tick();s.bump();clearToken();s.setCurrent({content:{schemaVersion:'2',name:{zh:'另一个账户'},baseUnit:'g',trackStock:false},commit:B,blobSha:'other-b'});await draw(s);wait.resolve();await tick();assert(s.writes.length===0,'old upload issued save in new session');assert(app.querySelector('#adm-ing-name-zh').value==='另一个账户','auth data mixed');return{writes:s.writes.length,visible:app.querySelector('#adm-ing-name-zh').value};});
};
</script></html>
