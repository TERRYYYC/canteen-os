# gitleaks 配置（issue #26）。规则本体沿用上游默认集，这里只放「明确不是密钥」的豁免。
#
# 规矩：每条豁免必须同时窄到三个维度——哪条规则（targetRules）、哪些路径（paths）、
# 值长什么形状（regexes），且 condition = "AND"。不许整文件放行，不许整条规则关掉。
# 加新豁免前先确认该值确实是假值/标识符，并在注释里写清楚它是什么。

[extend]
useDefault = true

# .github/backlog/round-1.json 是 issue 待办清单，每条用一个 "key" 字段做 slug
# （"v01-build-data"、"v02-purchase" 之类，由 scripts/create-issues.mjs 读取）。
# 上游 generic-api-key 按熵值把其中一条判成了密钥：首跑命中 round-1.json:242
# 的 "v02-purchase"（entropy 3.58，刚好过默认阈值 3.5）。
#
# 注：这里匹配的是**捕获组（secret）**而不是整个 match。generic-api-key 的前导
# [\w.-]{0,50}? 不含引号，match 从 key 开始、不包含前面那个双引号，照 match 写会不生效。
[[allowlists]]
  description = "backlog issue slugs (.github/backlog/*.json \"key\" fields) are not API keys"
  targetRules = ["generic-api-key"]
  condition = "AND"
  paths = ['''^\.github/backlog/[^/]+\.json$''']
  regexes = ['''^v\d{2}-[a-z0-9-]+$''']

# PR #95: these exact audit fields contain verified Git commit IDs, not credentials.
# Each value resolves to a commit object. Keep field/value pairs fixed: new values,
# other fields, other paths and additional content on the line remain scanned.
# The line target may include the preceding newline of its git diff fragment.
[[allowlists]]
  description = "Verified team-meals audit commit references (PR 95)"
  targetRules = ["generic-api-key"]
  condition = "AND"
  paths = ['''^\.github/backlog/team-meals\.json$''']
  regexTarget = "line"
  regexes = [
    '''^(?:\r?\n)?[ \t]*"storeAuthContractCommit"[ \t]*:[ \t]*"7191d631c289347a0ddc2bfe538745045184e5d5",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"storeAuthCandidateCommit"[ \t]*:[ \t]*"d8bb56875e927a08627f480473895bdbd5c75a21",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"storeAuthAcceptedCommit"[ \t]*:[ \t]*"d8bb56875e927a08627f480473895bdbd5c75a21",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"C2bAuxAuthContractCandidate"[ \t]*:[ \t]*"5885f8f3b6d80d376032555c84f8191a1392e761",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"C2bAuxAuthCandidateCommit"[ \t]*:[ \t]*"27867290bd6da40e06e7b6d28b886de9a073503f",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"C2bAuxAuthAcceptedCommit"[ \t]*:[ \t]*"27867290bd6da40e06e7b6d28b886de9a073503f",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"C2bAuxAuthHandoffHead"[ \t]*:[ \t]*"5885f8f3b6d80d376032555c84f8191a1392e761",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"C2bC1AuthContractCommit"[ \t]*:[ \t]*"28eb30f8c572a466215f82935bbfc54f8d9cb33b",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"storeAuthConsumedMerge"[ \t]*:[ \t]*"88125b62c0a33ee9af0eeeae186f830fd6fecf9a",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"storeAuthPageCandidateCommit"[ \t]*:[ \t]*"acd44750b0593f682fa14ecd16daeff898655078",?[ \t]*$''',
    '''^(?:\r?\n)?[ \t]*"storeAuthPageAcceptedCommit"[ \t]*:[ \t]*"acd44750b0593f682fa14ecd16daeff898655078",?[ \t]*$''',
  ]
