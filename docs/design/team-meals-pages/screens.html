Demo Contract: product_experience_gate × internal_product_gate. Owner: RC-D.
Question: Can a small team plan meals without counts, inspect every recorded ingredient,
make this list's decisions, and understand version and interrupted-save boundaries?
Visual truth: ../screens-v2.html + ../backoffice-v1.html; D0-contract.md supplies scope.
Native elements: directory corner/drawer, date and meal chips, Bitter headings,
Golos Text/Noto Sans SC stacks, existing light tokens, cards and bottom actions.
Stylized elements: collapsible design-state toolbar only. No backend or core integration claim.
Truth label: proposal / illustrative data / not persisted, always visible.
sourceSelectors: #screen-plan #screen-purchase #screen-ingredient #screen-dish
#screen-menu #screen-prep #screen-edit. viewport: 393×852,1440×900; lang: zh,en,uk.
state: dirty,saving,unknown,conflict,unconfigured,saved. approvedBy:null; approvedAt:null.
Manual journey: open #plan; edit optional count; change day/week and language; value stays.
Open #purchase; change scope; inspect affected/removed decisions; save simulated basis;
then choose a decision and separately simulate save. Open ingredient and source dish.
Use scenario selector to inspect unknown/conflict/unconfigured; no operation contacts a server.
No refresh persistence claim. Typography falls back locally; no network fonts/assets required.

function title(key,sub,version=false){return `<div class="title-row"><div><div class="eyebrow">CANTEENOS / ${page().toUpperCase()}</div><h1>${t(key)}</h1><p class="subtitle">${t(sub)}</p></div>${version?chip(s.current?'currentBasis':'basis',s.current?'warn':''):chip('optional')}</div>`}
function status(){const phase=s.phase,style=phase==='conflict'?'bad':phase==='saved'?'ok':phase==='dirty'?'neutral':'';return `<div class="note state-note ${style}" id="save-status" role="status" data-state="${phase}"><strong>${t(phase)} <small>· ${t('phaseDemo')}</small></strong>${t(phase+'Note')}<div class="state-actions">${phase==='unknown'?`<button data-action="verify">${t('verify')}</button>`:''}${phase==='conflict'?`<button data-action="compare">${t('compare')}</button>`:''}${phase==='saving'?`<button data-action="ack">${t('ack')}</button>`:''}</div>${s.showVerify?`<p style="margin-top:10px">${t('verifyNote')}</p>`:''}${s.showCompare?`<p style="margin-top:10px">${t('mine')}</p><p>${t('remote')}</p><div class="state-actions"><button data-action="keep">${t('keep')}</button></div>`:''}</div>`}
const blocked=()=>['saving','unknown','conflict','unconfigured'].includes(s.phase);function savebar(kind='save'){return `<div class="action-bar"><p>${t('memory')}<br>${t('publish')}</p><div class="actions"><button class="btn primary" data-action="save" ${blocked()?'disabled':''}>${t(kind)}</button>${page()==='plan'?`<button class="btn" data-action="preview">${t('preview')}</button>`:''}${page()==='edit'?`<button class="btn" data-action="activate" ${blocked()?'disabled':''}>${t('saveActive')}</button>`:''}</div></div>`}
function plan(){const dates=s.view==='day'?[11]:[11,12];return title('plan','planSub')+status()+`<div class="toolbar"><div class="chips"><span class="chip">2026.09.07 — 09.13</span>${chip('week')}</div><div class="seg"><button data-view="day" class="${s.view==='day'?'on':''}">${t('day')}</button><button data-view="week" class="${s.view==='week'?'on':''}">${t('week')}</button></div></div><div class="grid"><div class="stack"><div class="card" id="plan-rows">${s.rows.length?dates.map(date=>`<div class="plan-day">09.${date} <small class="muted">${t(date===11?'friday':'saturday')}</small></div>${s.rows.map((r,i)=>r.date!==date?'':`<div class="plan-row"><span class="chip">${t(r.meal)}</span><div class="dish-name">${n(r.dish)}<small>${t(r.count?'recorded':'optional')}</small></div><label><span class="small muted">${t('servings')}</span><input class="count num" data-count="${i}" value="${esc(r.count)}" type="number" min="1" step="1" placeholder="${t('notSet')}" aria-label="${n(r.dish)} ${t('servings')}"></label><button class="delete" data-remove="${i}" aria-label="${t('remove')}">×</button></div>`).join('')}`).join(''):`<div class="empty">${t('emptyPlan')}</div>`}<div class="add-row"><button class="text-btn" data-action="add">+ ${t('add')}</button>${link('edit',t('newDish'),'text-btn')}</div></div><div class="note neutral">${t('wholePlan')}</div></div><aside class="stack"><div class="card pad"><div class="section-label">${t('summary')}</div><div class="metric">${s.rows.length}<small>${t('dishes')}</small></div><p class="small muted">${t('allRefsNote')}</p><div class="actions"><button class="btn" data-action="preview">${t('preview')} →</button></div></div><div class="note">${t('countNote')}</div></aside></div>`+savebar()}
function ingredientRows(){return s.items.map(item=>{const prev=false;return `<article class="purchase-item" data-item="${item.id}"><div class="item-top"><div><h3>${link('ingredient',n(item.id))}</h3>${tri(item.id)}</div>${item.id==='soy'?chip('missingPack','warn'):item.id==='salt'?chip('toTaste'):item.id==='tomato'?chip('missingQty','warn'):chip('mainIngredient')}</div><p class="source">${t('sources')} · ${link('dish',n('stir'))}${item.id==='tomato'?' / '+link('dish',n('soup')):''} · 09.11 ${t('lunch')}${s.review?' + '+t('dinner'):''}</p>${prev?`<div class="item-note">${t('previous')}：${t(item.id==='tomato'?'buy':'available')} ${item.id==='tomato'?'· '+t('bought'):''}</div>`:''}<div class="decision" role="group" aria-label="${n(item.id)}"><button data-item-id="${item.id}" data-decision="check" class="${item.decision==='check'?'on':''}" aria-pressed="${item.decision==='check'}" ${s.review===1?'disabled':''}>${t('check')}</button><button data-item-id="${item.id}" data-decision="buy" class="${item.decision==='buy'?'on':''}" aria-pressed="${item.decision==='buy'}" ${s.review===1?'disabled':''}>${t('buy')}</button><button data-item-id="${item.id}" data-decision="available" class="${item.decision==='available'?'on':''}" aria-pressed="${item.decision==='available'}" ${s.review===1?'disabled':''}>${t('available')}</button></div>${item.decision==='buy'?`<label class="bought"><input type="checkbox" data-bought="${item.id}" ${item.bought?'checked':''} ${s.review===1?'disabled':''}>${t('bought')}</label>`:''}${item.id==='soy'?`<p class="item-note">${t('seasoning')} · ${t('missingPack')} · ${t('missingQty')}</p>`:''}</article>`}).join('')}
function purchase(){const review=s.review?`<div class="note ${s.review>=2?'ok':''}" id="scope-review"><strong>${t(s.review>=2?'reviewSaved':'reviewTitle')}</strong><p>${t('reviewBody')}</p><ul class="review-list"><li>${t('affected')}</li><li>${t('removedBought')}</li></ul>${s.review===1?`<button class="btn" data-action="review-save" ${blocked()?'disabled':''}>${t('saveReview')}</button>`:''}</div>`:'';const exportText=[t('proposal'),t('basis'),...s.items.map(i=>`${n(i.id)} — ${t(i.decision)}${i.bought?' / '+t('bought'):''} — ${t('sources')}: ${n('stir')}${i.id==='tomato'?' / '+n('soup')+' — '+t('missingQty'):''}${i.id==='soy'?' — '+t('missingPack'):''}`),t('noTotalNote')].join('\n');return title('purchase','purchaseSub',true)+status()+(s.local?`<div class="note state-note" id="local-preview"><strong>${t('local')}</strong>${t('localNote')}</div>`:'')+`<div class="toolbar"><div><div class="section-label">${t('range')}</div><div class="chips"><span class="chip">09.11 ${t('lunch')}${s.review?' + '+t('dinner'):''}</span>${chip('basis')}</div></div><button class="btn quiet" data-action="scope" ${s.review?'disabled':''}>${t('changeScope')}</button></div><div class="grid"><div class="stack">${review}<div class="card" id="shopping-items">${ingredientRows()}</div></div><aside class="stack"><div class="card pad"><div class="section-label">${t('estimate')}</div><h2>${t('noTotal')}</h2><p class="small muted" style="margin-top:12px">${t('noTotalNote')}</p></div><div class="card pad"><h3>${t('allRefs')}</h3><p class="small muted" style="margin-top:8px">${t('allRefsNote')}</p><button class="btn" style="margin-top:16px" data-action="export">${t('export')}</button>${s.export?`<textarea class="export" id="export-content" readonly aria-label="${t('export')}">${esc(exportText)}</textarea><p class="small muted">${t('exportNote')}</p>`:''}</div></aside></div>`+savebar()}
function versionControl(){return `<div class="toolbar"><div class="chips">${chip(s.current?'currentBasis':'basis',s.current?'warn':'')}<span class="small muted">${t('versionNote')}</span></div><button class="btn quiet" data-action="current">${t(s.current?'backBasis':'current')}</button></div>${s.current?`<div class="note state-note">${t('currentNotice')}</div>`:''}`}
const media=()=>`<div class="blank-media"><div class="outline" aria-hidden="true">—</div><strong>${t('imageMissing')}</strong><span>${t('imageNote')}</span></div>`;
const meta=(k,v)=>`<div><dt>${t(k)}</dt><dd>${v}</dd></div>`;
function ingredient(){return link('purchase','← '+t('backList'),'back')+title('ingredient','purchaseSub',true)+versionControl()+`<div class="grid"><div class="stack"><div class="card pad"><div class="metadata-title"><div><h1>${n('tomato')}</h1>${tri('tomato')}</div>${chip('mainIngredient')}</div><div style="margin-top:20px">${media()}</div><dl class="meta">${meta('imageLicense',t('unrecorded'))}</dl></div><div class="card"><div class="card-title"><h3>${t('sources')}</h3><span class="muted">09.11 · ${t('lunch')}</span></div><div class="recipe-row"><div>${link('dish',n('stir'))}<small>${t('original')}</small></div><span class="recipe-qty">300 g</span></div><div class="recipe-row"><div>${link('dish',n('soup'))}<small>${t('original')}</small></div><span class="recipe-qty unknown">${t('missingQty')}</span></div></div><div class="note">${t('noTotalNote')}</div></div><aside class="stack"><div class="card pad"><h3>${t('ingredient')}</h3><dl class="meta">${meta('role',t('mainIngredient'))}${meta('package',t('missingPack'))}${meta('supplier',t('unrecorded'))}${meta('provenance',t('sourceMissing'))}</dl></div><div class="note neutral">${t('versionNote')}</div></aside></div>`}
function recipe(){return `<div class="card"><div class="card-title"><h3>${t('original')}</h3><span class="muted">${t('phaseDemo')}</span></div>${[['tomato','300 g'],['egg','3 pcs'],['salt',t('toTaste')],['soy',t('missingQty')]].map(([id,qty])=>`<div class="recipe-row"><div>${link('ingredient',n(id))}<small>${['salt','soy'].includes(id)?t('seasoning'):t('mainIngredient')}</small></div><span class="recipe-qty ${id==='soy'?'unknown':''}">${qty}</span></div>`).join('')}</div>`}
function steps(){return `<div class="card"><div class="card-title"><h3>${t('steps')}</h3><span class="muted">3</span></div>${['stepOne','stepTwo','stepThree'].map((k,i)=>`<div class="step"><div class="n">${i+1}</div><div>${t(k)}<div class="technique">${t('techniqueMissing')}</div><div class="technique">${t('clip')}：${t('unrecorded')}</div></div></div>`).join('')}</div>`}
function dish(){return link('purchase','← '+t('backList'),'back')+title('dish','dishDesc',true)+versionControl()+`<div class="grid"><div class="stack"><div class="card pad"><h1>${n('stir')}</h1>${tri('stir')}<div class="actions">${link('prep',t('goPrep')+' →','btn primary')}${link('edit',t('edit'),'btn')}</div><div style="margin-top:20px">${media()}</div><p class="small muted" style="margin-top:10px">${t('imageLicense')}：${t('unrecorded')}</p></div>${recipe()}${steps()}</div><aside class="stack"><div class="note"><strong>${t('baseMissing')}</strong>${t('scaleNote')}</div><div class="card pad"><h3>${t('provenance')}</h3><dl class="meta">${meta('provenance',t('sourceMissing'))}${meta('techniques',t('unrecorded'))}${meta('clip',t('unrecorded'))}</dl></div></aside></div>`}
function menu(){return title('menu','menuSub',true)+`<div class="days">${[7,8,9,10,11,12,13].map(d=>`<button class="date ${s.selectedDay===d?'on':''}" data-day="${d}" aria-pressed="${s.selectedDay===d}"><small>09</small><b>${d}</b></button>`).join('')}</div><div class="toolbar"><div class="chips">${chip('lunch','on')}${chip('basis')}</div>${link('plan',t('plan'),'btn quiet')}</div><div class="grid"><div class="stack"><div class="card">${s.selectedDay===11?['stir','soup'].map(id=>`<div class="menu-dish"><div><h2>${link('dish',n(id))}</h2>${tri(id)}<p>${t('ingredientsLabel')}：${id==='stir'?[n('tomato'),n('egg'),n('salt'),n('soy')].join(' · '):n('tomato')}</p><div class="actions">${link('dish',t('showRecipe')+' →','text-btn')}</div></div><div class="menu-letter">${t('imageMissing')}</div></div>`).join(''):`<div class="empty">${t('emptyPlan')}</div>`}</div></div><aside class="stack"><div class="card pad"><h3>${t('allRefs')}</h3><p class="small muted" style="margin-top:8px">${t('allRefsNote')}</p><div class="actions">${link('purchase',t('purchase')+' →','btn primary')}</div></div><div class="note neutral">${t('countNote')}</div></aside></div>`}
function prep(){return link('menu','← '+t('menu'),'back')+title('prep','prepSub',true)+`<div class="toolbar"><div class="chips"><span class="chip">09.11 ${t('lunch')}</span>${chip('basis')}</div>${link('dish',t('dish'),'btn quiet')}</div><div class="grid"><div class="stack"><div class="card pad"><h1>${n('stir')}</h1>${tri('stir')}<p class="small muted" style="margin-top:12px">${t('baseMissing')}</p></div>${recipe()}${steps()}</div><aside class="stack"><div class="card pad"><div class="section-label">${t('scale')}</div><h2>${t('noTotal')}</h2><p class="small muted" style="margin-top:12px">${t('scaleNote')}</p></div><div class="note neutral">${t('sourceMissing')}</div></aside></div>`}
function edit(){return title('edit','editSub')+status()+`<div class="grid"><div class="stack"><div class="card pad"><div class="fields">${['zh','en','uk'].map(l=>`<label class="field"><span>${t('dishName')} · ${l.toUpperCase()}</span><input data-edit="${l}" value="${esc(s.edit[l])}"></label>`).join('')}</div><label class="field"><span>${t('description')}</span><textarea data-edit="description">${esc(s.edit.description)}</textarea></label><label class="field"><span>${t('base')} · ${t('optional')}</span><input type="number" min="1" step="1" data-edit="base" value="${esc(s.edit.base)}" placeholder="${t('notSet')}"></label><p class="small muted">${t('editFact')}</p></div><div class="card pad"><h3>${n('tomato')}</h3>${tri('tomato')}<div class="qty-fields" style="margin-top:18px"><label class="field"><span>${t('qtyKind')}</span><select id="quantity-kind">${['unknown','known','toTaste'].map(k=>`<option value="${k}" ${s.edit.qtyKind===k?'selected':''}>${t(k==='unknown'?'missingQty':k)}</option>`).join('')}</select></label><label class="field" ${s.edit.qtyKind!=='known'?'hidden':''}><span>${t('quantity')}</span><input data-edit="qty" type="number" min="0.001" step="any" value="${esc(s.edit.qty)}"></label><label class="field" ${s.edit.qtyKind!=='known'?'hidden':''}><span>${t('unit')}</span><select data-edit="unit">${['g','kg','ml','pcs'].map(u=>`<option ${s.edit.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><p class="small muted">${t('editFact')}</p></div>${steps()}</div><aside class="stack"><div class="note"><strong>${t('preserve')}</strong>${t('preserveNote')}</div><div class="card pad"><h3>${t('provenance')}</h3><p class="small muted" style="margin-top:10px">${t('sourceMissing')}</p><p class="small muted" style="margin-top:10px">${t('imageLicense')}：${t('unrecorded')}</p></div></aside></div>`+savebar('saveDraft')}
const screens={plan,purchase,ingredient,dish,menu,prep,edit};
function changed(){if(s.phase==='saving')s.editedWhileSaving=true;if(!['saving','unknown','conflict','unconfigured'].includes(s.phase))s.phase='dirty';const notice=$('#save-status');if(notice){notice.outerHTML=status();$all('#save-status [data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action));$('#scenario').value=s.phase}}
function render(){document.documentElement.lang=lang;document.title='CanteenOS · '+t(page());$('#language').value=lang;$('#truth-title').textContent=t('proposal');$('#truth-note').textContent=t('truth');$('#brand-sub').textContent=t('team');$('#directory').setAttribute('aria-label',t('directory'));$('#drawer-title').textContent=t('directory');$('#tool-title').textContent=t('inspect');$('#scenario-label').textContent=t('scenario');$('#tool-note').textContent=t('toolNote');$('#reset').textContent=t('reset');$('#scenario').innerHTML=['dirty','saving','unknown','conflict','unconfigured','saved'].map(k=>`<option value="${k}" ${s.phase===k?'selected':''}>${t(k)}</option>`).join('');const nav=routes.map((k,i)=>`<a href="#${k}" class="nav-item ${page()===k?'on':''}" ${page()===k?'aria-current="page"':''}><span class="nav-index">${String(i+1).padStart(2,'0')}</span>${t(k)}</a>`).join('');$('#navigation').innerHTML=nav;$('#drawer-navigation').innerHTML=nav;$('#side-foot').innerHTML=`<b>${t('disconnected')}</b>${t('memory')}`;$('#drawer-foot').innerHTML=$('#side-foot').innerHTML;$('#main').innerHTML=`<section id="screen-${page()}" data-page="${page()}">${screens[page()]()}<p class="footer-note">${t('footer')}</p></section>`;bind()}
function bind(){ $all('[data-count]').forEach(el=>el.addEventListener('input',()=>{s.rows[Number(el.dataset.count)].count=el.value;changed()}));$all('[data-remove]').forEach(el=>el.onclick=()=>{s.rows.splice(Number(el.dataset.remove),1);changed();render()});$all('[data-view]').forEach(el=>el.onclick=()=>{s.view=el.dataset.view;render()});$all('[data-day]').forEach(el=>el.onclick=()=>{s.selectedDay=Number(el.dataset.day);render()});$all('[data-edit]').forEach(el=>el.addEventListener('input',()=>{s.edit[el.dataset.edit]=el.value;changed()}));if($('#quantity-kind'))$('#quantity-kind').onchange=ev=>{s.edit.qtyKind=ev.target.value;changed();render()};$all('[data-decision]').forEach(el=>el.onclick=()=>{const item=s.items.find(i=>i.id===el.dataset.itemId);item.decision=el.dataset.decision;if(item.decision!=='buy')item.bought=false;changed();render()});$all('[data-bought]').forEach(el=>el.onchange=()=>{s.items.find(i=>i.id===el.dataset.bought).bought=el.checked;changed();render()});$all('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action))}
function act(action){if(action==='add'){s.rows.push({date:11,meal:'lunch',dish:'stir',count:''});changed()}if(action==='save'||action==='activate'){if(blocked())return;s.phase='saving';s.editedWhileSaving=false;s.showVerify=false;s.showCompare=false}if(action==='ack')s.phase=s.editedWhileSaving?'dirty':'saved';if(action==='verify')s.showVerify=true;if(action==='compare')s.showCompare=true;if(action==='keep')s.showCompare=false;if(action==='preview'){s.local=true;location.hash='purchase'}if(action==='scope'){s.review=1;s.items=s.items.filter(i=>i.id!=='salt').map(i=>({...i,decision:'check',bought:false}));changed()}if(action==='review-save'){if(blocked())return;s.review=2;s.phase='saved'}if(action==='current')s.current=!s.current;if(action==='export')s.export=!s.export;render()}
$('#language').onchange=ev=>{lang=ev.target.value;render()};$('#scenario').onchange=ev=>{s.phase=ev.target.value;s.showVerify=false;s.showCompare=false;render()};$('#reset').onclick=()=>{s=initial();render()};$('#directory').onclick=()=>$('#drawer').showModal();$('#close-drawer').onclick=()=>$('#drawer').close();$('#drawer').onclick=ev=>{if(ev.target.closest('a'))$('#drawer').close()};window.addEventListener('hashchange',()=>{s.current=false;render();window.scrollTo(0,0)});render();
</script>
</body>
</html>
